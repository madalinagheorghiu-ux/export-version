/* ============================ Bell panel — unified notification center ============================ */
// One feed — exports and migrations unified. Other kinds (licence expiry, etc.) branch in NotifItem.
// Title convention (see Product Specs): `{subject} {outcome}`, subject constant per type, outcome by status.
function notifStatus(item){
  if (item.type === 'org'){
    return { cls: item.cls || 'ok', icon: I[item.icon] || I.check, title: item.title };
  }
  if (item.type === 'migration'){
    switch(item.state){
      case 'IN_PROGRESS': return { cls:'proc', icon:I.check, title:'Migrating instances…' };
      case 'COMPLETED':   return { cls:'ok',   icon:I.check, title:'Instances migrated' };
      case 'FAILED':      return { cls:'err',  icon:I.errCircle, title:'Instance migration failed' };
    }
  }
  // export — subject depends on what's being exported: a runtime build vs a project version
  const subj = item.source && item.source.kind==='build' ? 'Build export' : 'Version export';
  const n = (item.exclusions||[]).length;
  switch(item.state){
    case 'PROCESSING':            return { cls:'proc', icon:I.check, title:`Preparing ${subj.toLowerCase()}…` };
    case 'READY_WITH_EXCLUSIONS': return { cls:'warn', icon:I.warn,  title:`${subj} ready — ${n} resource${n>1?'s':''} excluded` };
    case 'FAILED':                return { cls:'err',  icon:I.errCircle, title:`${subj} failed` };
    default:                      return { cls:'ok',   icon:I.check, title:`${subj} ready to download` };
  }
}

// One-line title. Exposes the full string as a tooltip ONLY when it's actually clipped — a tooltip
// that repeats fully-visible text is noise.
//
// The measurement happens on hover, which is the moment the answer is actually needed: it's correct
// no matter how the panel has been resized since mount (it has three width tiers), and it costs no
// observer and no re-render. Setting the attribute here is early enough — the browser reads `title`
// when it decides to show the tooltip, which is after the hover delay.
function NotifTitle({ text }){
  const sync = (e) => {
    const el = e.currentTarget;
    if (el.scrollWidth > el.clientWidth + 1) el.setAttribute('title', text);
    else el.removeAttribute('title');
  };
  return <div className="t" onMouseEnter={sync} onFocus={sync}>{text}</div>;
}

function NotifItem({ item, onAct, onActMig, onActOrg, onRetry, onRetryMig, onMarkRead, onDismiss }){
  const st = notifStatus(item);
  const isOrg = item.type === 'org';
  const isMig = item.type === 'migration';
  const isProcessing = item.state === 'PROCESSING' || item.state === 'IN_PROGRESS';
  const isFailed = !isOrg && item.state === 'FAILED';
  const isReady = isOrg ? true : isMig ? item.state==='COMPLETED' : jobReady(item);
  const unread = isUnreadItem(item);
  const subtitle = isOrg
    ? item.sub
    : isMig
      ? `${item.srcBuild} → ${item.tgtBuild} · ${item.summary.migrateTo.length} process${item.summary.migrateTo.length>1?'es':''}`
      : jobLabel(item) + (item.fromCache?' · reused':'');
  // A failure names its cause and (both ops being atomic) reassures nothing was applied — §8.
  const failCause = isFailed ? (item.failReason || (isMig ? FAIL_COPY.migration : FAIL_COPY.export)) : null;
  const handleClick = () => {
    if (isOrg) return onActOrg(item.id);
    if (!isReady) return;
    isMig ? onActMig(item.id) : onAct(item.id);
  };
  return (
    <div className={'nitem'+(unread?' unread':'')}>
      <div className="nmain" onClick={handleClick} style={{cursor:isReady?'pointer':'default'}}>
        <span className={'nicon '+st.cls}>{isProcessing ? <span className="mini-spin"></span> : st.icon}</span>
        <div className="nbody">
          {/* Title leads; timestamp right-aligned on the same row. The on-hover mark-as-read sits in a
              fixed slot before the time, so timestamps stay column-aligned across read/unread rows. */}
          <div className="nline1">
            <NotifTitle text={st.title} />
            <span className="n-actions">
              {unread &&
                <button className="n-markread" title="Mark as read" onClick={(e)=>{e.stopPropagation();onMarkRead(item.id);}}>{I.check}</button>}
            </span>
            <span className="ntime">{relTime(item.ts)}</span>
          </div>
          {/* context — org items carry the org area; workspace-scoped items carry the type + workspace/project */}
          <div className="nctx-row">
            {isOrg
              ? <span className="nmeta">{item.ctx.area} / <span className="nproj">{item.ctx.target}</span></span>
              : item.ctx && <>
                  <span className={'ws-badge sm '+wsTone(item.ctx.wsType)}>{item.ctx.wsType}</span>
                  <span className="nmeta">{item.ctx.workspace} / <span className="nproj">{I.folder}{item.ctx.project}</span></span>
                </>}
          </div>
          <div className="s">{subtitle}</div>
          {/* Failure cause — same wording as the toast and detail page, so it reads as one error. */}
          {failCause && <div className="s nfail">{failCause}</div>}
          {/* Action sits under the text, full width available. Tertiary: text + icon, no border. */}
          <div className="nact">
            {/* org action */}
            {isOrg &&
              <button className="nbtn" onClick={(e)=>{e.stopPropagation();onActOrg(item.id);}}>{I.arrowR} {item.cta}</button>}
            {/* export actions */}
            {!isOrg && !isMig && item.state==='PROCESSING' &&
              <span className="nproc"><span className="mini-spin"></span> Preparing</span>}
            {!isOrg && !isMig && item.state==='READY' &&
              <button className="nbtn" onClick={(e)=>{e.stopPropagation();onAct(item.id);}}>{I.dl} Download</button>}
            {!isOrg && !isMig && item.state==='READY_WITH_EXCLUSIONS' &&
              <button className="nbtn" onClick={(e)=>{e.stopPropagation();onAct(item.id);}}>{I.arrowR} Review</button>}
            {isFailed &&
              <button className="nbtn" onClick={(e)=>{e.stopPropagation();(isMig?onRetryMig:onRetry)(item.id);}}>{I.retry} Retry</button>}
            {/* migration actions */}
            {isMig && item.state==='IN_PROGRESS' &&
              <span className="nproc"><span className="mini-spin"></span> In Progress</span>}
            {isMig && item.state==='COMPLETED' &&
              <button className="nbtn" onClick={(e)=>{e.stopPropagation();onActMig(item.id);}}>{I.arrowR} View</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

// Scope filter — read-state, or one workspace type.
const SCOPE_LABEL = {
  ALL:        ['All notifications', null],
  UNREAD:     ['Unread',            null],
  PRODUCTION: ['Production',         '#3a4250'],
  STAGING:    ['Staging',            '#f0b429'],
  SANDBOX:    ['Sandbox',            '#1f6feb'],
};
// Listed sandbox → staging → production, matching how work actually promotes. Each row renders
// as the same pill the feed items carry, so the filter and the thing it filters read alike.
const WORKSPACE_TYPE_OPTS = ['SANDBOX','STAGING','PRODUCTION'];
const itemScope = (item) => item.type==='org' ? 'ORG' : (item.ctx ? item.ctx.wsType : null);
// Unread = an unread TERMINAL result that needs you (§5.11) — ready / done / FAILED / org.
// A failure is actionable (Retry), so it counts; only in-progress is excluded.
const isUnreadItem = (item) =>
  item.type==='org'       ? !item.read :
  item.type==='migration' ? ((item.state==='COMPLETED' || item.state==='FAILED') && !item.read) :
  ((jobReady(item) || item.state==='FAILED') && !item.read);
// One searchable haystack per item: title + label + context.
function searchText(item){
  const st = notifStatus(item);
  const sub = item.type==='org'
    ? `${item.sub||''} organization`
    : item.type==='migration'
      ? `${item.opType} ${item.srcBuild} ${item.tgtBuild}`
      : `${item.source ? item.source.label : ''} ${item.target}`;
  const c = item.ctx || {};
  return `${st.title} ${sub} ${c.wsType||''} ${c.workspace||''} ${c.project||''} ${c.area||''} ${c.target||''}`.toLowerCase();
}
/* Empty-state copy, keyed by cause (§5.7.1). Naming the cause is what makes the state
   recoverable — in three of the four the user's own search/filter is hiding the items. */
const EMPTY_MSG = {
  FIRST_RUN: 'No notifications yet.',
  SEARCH:    'No notifications match your search.',
  UNREAD:    'No unread notifications.',
  FILTER:    'No notifications for this filter.',
};
function BellPanel({ jobs, migrations, orgNotifs, onClose, onMarkAll, onAct, onActMig, onActOrg, onRetry, onRetryMig, onMarkRead, onDismiss, stop }){
  const [filter, setFilter] = useState('ALL');   // ALL | UNREAD | ORG | PRODUCTION | STAGING | SANDBOX
  const [filterOpen, setFilterOpen] = useState(false);
  const [q, setQ] = useState('');
  const query = q.trim().toLowerCase();

  const feed = [...jobs, ...migrations, ...orgNotifs]
    .filter(item=>!item.dismissed)
    .sort((a,b)=>b.ts-a.ts);

  const globalUnread = feed.filter(isUnreadItem).length; // header "Mark all as read" + the Unread filter count
  const curLabel = (SCOPE_LABEL[filter] || SCOPE_LABEL.ALL)[0];

  // One single-select filter: read-state (All / Unread) or one workspace type, plus free-text search.
  const shown = feed.filter(item=>
    (!query || searchText(item).includes(query)) &&
    (filter==='ALL'    ? true :
     filter==='UNREAD' ? isUnreadItem(item) :
                         itemScope(item)===filter)
  );

  // Bucket the (already time-sorted) list into Today / Yesterday / Earlier, order preserved.
  const groups = [];
  const seen = {};
  shown.forEach(item=>{
    const b = dayBucket(item.ts);
    if (seen[b]===undefined){ seen[b]=groups.length; groups.push([b, []]); }
    groups[seen[b]][1].push(item);
  });

  // Name the cause: three of the four cases are the user's own search/filter hiding items, and
  // the fix is to clear it — a generic "nothing here" would read as "you have none".
  // One switch drives both the copy and the alignment, so the two can't drift apart.
  const emptyKind =
    feed.length===0   ? 'FIRST_RUN' :
    query             ? 'SEARCH' :
    filter==='UNREAD' ? 'UNREAD' :
                        'FILTER';
  const emptyMsg = EMPTY_MSG[emptyKind];
  // SEARCH stays top-aligned: it's live feedback on typing, so it must sit where a result would
  // and not jump to the middle of the band on the keystroke that empties the list. The other
  // three are stable states of an empty container, and centre.
  const emptyCentred = emptyKind !== 'SEARCH';

  return (
    <div className="bell-panel" onClick={stop}>
      <div className="bp-head">
        <h4>Notification</h4>
        <button disabled={globalUnread===0} onClick={onMarkAll}>Mark all as read</button>
      </div>
      <div className="bp-search-row">
        <div className="bp-search">
          {I.search}
          <input placeholder="Search notifications..." value={q} onChange={e=>setQ(e.target.value)} />
          {q && <button className="bp-search-clear" title="Clear" onClick={()=>setQ('')}>{I.x}</button>}
        </div>
        <div className="bp-filter">
          <button className={'bp-filter-btn'+(filter!=='ALL'?' active':'')} title="Filter"
                  onClick={()=>setFilterOpen(o=>!o)}>{I.filter}</button>
          {filterOpen && <>
            <div className="filter-dd-backdrop" onClick={(e)=>{e.stopPropagation();setFilterOpen(false);}}></div>
            <div className="filter-dd-menu right">
              {/* Read-state rows are plain text; a workspace type is carried by its pill — the same
                  badge the feed items wear, so the filter and the thing it filters read alike. */}
              <div className={'filter-dd-item'+(filter==='ALL'?' sel':'')} onClick={()=>{setFilter('ALL');setFilterOpen(false);}}>
                All Notifications
              </div>
              <div className={'filter-dd-item'+(filter==='UNREAD'?' sel':'')} onClick={()=>{setFilter('UNREAD');setFilterOpen(false);}}>
                Unread
                {globalUnread>0 && <span className="dd-count">{globalUnread}</span>}
              </div>
              <div className="filter-dd-div"></div>
              <div className="filter-dd-lbl">Workspace Type</div>
              {WORKSPACE_TYPE_OPTS.map(k=>(
                <div key={k} className={'filter-dd-item'+(filter===k?' sel':'')}
                     onClick={()=>{setFilter(k);setFilterOpen(false);}}>
                  <span className={'ws-badge sm '+wsTone(k)}>{k}</span>
                </div>
              ))}
            </div>
          </>}
        </div>
      </div>
      <div className={'nlist'+(shown.length===0 && emptyCentred ? ' is-empty':'')}>
        {shown.length===0 && <div className="empty">{emptyMsg}</div>}
        {groups.map(([bucket, items])=>(
          <div key={bucket}>
            <div className="bp-section">{bucket}</div>
            {items.map(item=> <NotifItem key={item.id} item={item}
              onAct={onAct} onActMig={onActMig} onActOrg={onActOrg}
              onRetry={onRetry} onRetryMig={onRetryMig} onMarkRead={onMarkRead} onDismiss={onDismiss} />)}
          </div>
        ))}
      </div>
      <div className="bp-foot">
        {I.clock} Notifications are kept for 30 days
        <a className="bp-foot-link" href="notification-center-spec.html" target="_blank" rel="noopener">Product Specs</a>
      </div>
    </div>
  );
}

/* ============================ Toasts ============================ */
// Auto-dismiss timing (a live toast should linger long enough to read + act, then get out of the way):
const TOAST_MS       = 5000; // no-action toast
const TOAST_MS_CTA   = 7000; // toast carrying a CTA — extra time to reach for it
const TOAST_GRACE_MS = 1000; // on resume, never leave less than this, so it can't vanish the instant you look away
// Most toasts on screen at once. Beyond this the oldest is evicted early rather than the newest
// being dropped or queued — see spec §5.5.1 for why there is no queue.
const TOAST_MAX      = 3;

// A toast mirrors a feed item's structure exactly (§5.3 bands), just shorter-lived.
// Each toast owns its own countdown so it can pause independently while the user reads/hovers it.
function Toast({ t, onAct, onClose }){
  const duration = t.action ? TOAST_MS_CTA : TOAST_MS;
  // remaining = ms left on the countdown; when running, startedAt marks when this run began.
  const remaining = useRef(duration);
  const startedAt = useRef(0);
  const timer     = useRef(null);
  // A set of active reasons to hold the timer (hover, focus, tab hidden); the countdown runs only when it's empty.
  const holds     = useRef(new Set());

  const clearTimer = ()=>{ if (timer.current){ clearTimeout(timer.current); timer.current=null; } };
  const run = ()=>{
    clearTimer();
    startedAt.current = Date.now();
    timer.current = setTimeout(()=>onClose(t.id), remaining.current);
  };
  const hold = (reason)=>{
    if (holds.current.size===0 && timer.current){
      // freeze: bank the time already elapsed on the current run
      remaining.current = Math.max(0, remaining.current - (Date.now()-startedAt.current));
      clearTimer();
    }
    holds.current.add(reason);
  };
  const release = (reason)=>{
    holds.current.delete(reason);
    if (holds.current.size===0){
      // grace so a nearly-expired toast doesn't disappear the instant the cursor/focus leaves
      remaining.current = Math.max(remaining.current, TOAST_GRACE_MS);
      run();
    }
  };

  useEffect(()=>{
    run();
    // Pause while the tab is backgrounded (user is elsewhere), resume when it returns.
    const onVis = ()=>{ document.hidden ? hold('tab') : release('tab'); };
    document.addEventListener('visibilitychange', onVis);
    return ()=>{ clearTimer(); document.removeEventListener('visibilitychange', onVis); };
  }, []);

  return (
    <div className={'toast '+(t.cls||'ok')}
         onMouseEnter={()=>hold('hover')}  onMouseLeave={()=>release('hover')}

function OpStatusPill({ status, state }){
  if (state==='IN_PROGRESS' || status==='In Progress') return <span className="status-pill in-progress"><span className="mini-spin"></span> In Progress</span>;
  if (status==='Completed')  return <span className="status-pill completed">Completed</span>;
  if (status==='Failed')     return <span className="status-pill failed">Failed</span>;
  return <span className="status-pill">{status}</span>;
}

              </div>}

              <th>Target Build ⇅</th><th>Operation Status ⇅</th><th>Updated at ⇅</th><th></th>

/* ============================ Migration Processing modal ============================ */
function MigrationProcessingModal({ migId, src, tgt, migrations, onClose, onComplete }){
  const [pct, setPct] = useState(4);
  const shownAt = useRef(Date.now()); // for the min-display guard

  // Animate progress bar
  useEffect(()=>{
    setPct(4);
    const t = setInterval(()=>setPct(p=>Math.min(p + (100/(MIGRATION_PROCESS_MS/250)), 96)), 250);
    return ()=>clearInterval(t);
  }, []);

  // Watch for migration completion → switch to detail. Held to MIN_MODAL_MS so a fast migration
  // doesn't flash this screen; the user still gets an explicit "it started" beat.
  useEffect(()=>{
    const m = migrations.find(x=>x.id===migId);
    if (!(m && m.state==='COMPLETED')) return;
    const wait = Math.max(0, MIN_MODAL_MS - (Date.now()-shownAt.current));
    const t = setTimeout(()=>onComplete(migId), wait);
    return ()=>clearTimeout(t);
  }, [migrations, migId]);

  return (
    <div className="modal-scrim" onClick={onClose}>
      <div className="modal" style={{width:580,maxWidth:'96vw'}} onClick={e=>e.stopPropagation()}>
        <div className="mbody" style={{padding:'36px 36px 28px'}}>
          <div className="proc" style={{paddingTop:0}}>
            <div className="spinner" style={{width:64,height:64,borderWidth:5,marginBottom:24}}></div>
            <h2 style={{margin:'0 0 10px',fontSize:22,fontWeight:700,color:'#1f2733'}}>Operation in Progress...</h2>
            <div className="mig-subtitle" style={{justifyContent:'center',marginBottom:24}}>
              Migrating running instances from
              <span className="build-ver">{I.hammer} {src}</span>
              <span style={{color:'#8c98a8'}}>to</span>
              <span className="build-ver">{I.hammer} {tgt}</span>
            </div>
            <p style={{margin:'0 0 24px',color:'#546070',fontSize:15,lineHeight:1.6,textAlign:'left',maxWidth:'100%'}}>
              This corrective action may take few minutes. You can close this window and keep working. We'll notify you when it's done.
            </p>
            <div className="progress" style={{margin:'0 0 0'}}><div className="bar" style={{width:pct+'%'}}></div></div>
            <div className="mfoot" style={{justifyContent:'flex-end',width:'100%',marginTop:24}}>
              <button className="btn-blue" onClick={onClose}>Close — keep working</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

        <span className="mig-sub-label" style={{margin:0}}>Map nodes</span>
        {needsMapping && (allMapped
          ? <span className="map-chip ok">{I.check} All nodes mapped</span>
          : <span className="map-chip warn">{I.warn} {unmapped} node{unmapped!==1?'s':''} need{unmapped===1?'s':''} your attention</span>)}
      </div>
      {needsMapping ? (
        <>
          {!allMapped && <div className="mig-unmatched-hint" style={{marginTop:5,marginBottom:12}}>{I.warn}<span>These nodes no longer exist on {tgt}. If a node was recreated, its ID changed so it can't match automatically — pick the new node, or it falls back to the last visited node.</span></div>}
          <div className="mig-nodemap-row" style={{margin:'8px 0 7px'}}>
            <div className="mig-col-head" style={{textTransform:'none',fontSize:11.5,color:'#5b6573'}}>Current node <span className="bchip">{I.gitBranch} {src}</span></div>
            <span/>
            <div className="mig-col-head" style={{textTransform:'none',fontSize:11.5,color:'#5b6573'}}>New node <span className="bchip">{I.gitBranch} {tgt}</span></div>
          </div>
          {unmatched.map((n,i)=>(
            <div className="mig-nodemap-row" key={i} style={{alignItems:'start',marginBottom:8}}>
              <NodeSelect icon={n.fromIcon} label={n.from} editable/>
              <span style={{color:'#c2cad4',textAlign:'center',paddingTop:11}}>{I.arrowR}</span>
              <NodeDropdown value={sel[i]||''} placeholder="Select new node" options={MAP_TARGET_NODES} onChange={(v)=>onSel(i,v)}/>
            </div>
          ))}
        </>
      ) : (
        <div className="mig-map-empty" style={{marginTop:2}}>The process is identical on both builds — nothing to map.</div>
      )}

      <MoveTokensSection p={p} src={src} tgt={tgt}/>
    </>
  );
}

/* ============================ Migration Step 1.5 — Configuration (full page) ============================ */
function MigrationConfigPage({ src, tgt, onBack, onCancel, onContinue }){
  const all = MIG_CONFIG_PROCESSES;
  // Auto-expand cards that need attention (mapping + not found); collapse ready.
  const [open, setOpen] = useState(() => {
    const o = {}; all.forEach(p=>{ if(p.status!=='ready') o[p.id]=true; }); return o;
  });
  const [notFound, setNotFound] = useState({});   // defaults to 'terminate' via choiceOf
  const [mapSel, setMapSel] = useState({});       // { procId: { nodeIdx: newNode } } — mapping selections
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState(null);
  const tog = id => setOpen(p=>({...p,[id]:!p[id]}));
  const choiceOf = id => notFound[id] || 'terminate';
  const setSel = (id, idx, val) => setMapSel(m=>({...m, [id]:{...(m[id]||{}), [idx]:val}}));

  // A "need mapping" process becomes Ready once every unmatched node has a new node selected.
  const effStatus = (p) => {
    if (p.status!=='mapping') return p.status;
    const unmatched = (p.nodeMap||[]).filter(n=>!n.matched);
    const sel = mapSel[p.id] || {};
    return (unmatched.length>0 && unmatched.every((_,i)=>sel[i])) ? 'ready' : 'mapping';
  };

  const readyN    = all.filter(p=>effStatus(p)==='ready').length;
  const mappingN  = all.filter(p=>effStatus(p)==='mapping').length;
  const notfoundN = all.filter(p=>p.status==='notfound').length;
  const total = all.length;
  const instCount = 20;

  const procs = all.filter(p =>
    (!statusFilter || effStatus(p)===statusFilter) &&
    (!search || p.name.toLowerCase().includes(search.toLowerCase()))
  );
  const READY_STATS = [
    { label:'Ready to migrate',    key:'ready',    n:readyN,    dot:'#1f7a4d', bg:'#e7f6ee' },
    { label:'Need node mapping',   key:'mapping',  n:mappingN,  dot:'#e2a81c', bg:'#fdf7e6' },
    { label:'Not found on target', key:'notfound', n:notfoundN, dot:'#d6453a', bg:'#fdeceb' },
  ];

  // If the active filter's bucket empties (e.g. the last "need mapping" process was
  // just resolved), clear it so the resolved card stays visible instead of vanishing
  // into an empty state.
  useEffect(()=>{
    if(statusFilter){
      const cur = READY_STATS.find(s=>s.key===statusFilter);
      if(cur && cur.n===0) setStatusFilter(null);
    }
  }, [readyN, mappingN, notfoundN, statusFilter]);

  return (
    <div style={{padding:'24px 28px',height:'100%',display:'flex',flexDirection:'column',minHeight:0}}>
      {/* Breadcrumb */}
      <div className="mig-detail-breadcrumb">
        <button className="back-btn" onClick={onBack}>{I.arrowL} Corrective Actions</button>
        <span className="sep">/</span>
        <span className="crumb-cur">Migration Configuration</span>
      </div>

      {/* Header card — mirrors the Migration Status header */}
      <div className="mig-summary-card">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'24px 28px',gap:24,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:280}}>
            <h2 style={{fontSize:20,fontWeight:700,color:'#1f2733',margin:'0 0 8px 0'}}>Migration Configuration</h2>
            <p style={{margin:0,color:'var(--muted)',fontSize:12.5,lineHeight:1.5,maxWidth:600}}>
              Define how active process instances will move from the source build to the target build. For guidance, check <span className="doclink">documentation</span>. No changes are applied until you start the corrective action.
            </p>
          </div>
          <div className="mig-build-row" style={{flexShrink:0}}>
            <div className="mig-build-box">
              <div className="mig-build-label">Source Build</div>
              <div className="mig-build-chip">{I.gitBranch} {src}</div>
            </div>
            <div style={{color:'#8c98a8',margin:'0 4px',paddingTop:20}}>{I.arrowR}</div>
            <div className="mig-build-box">
              <div className="mig-build-label">Target Build</div>
              <div className="mig-build-chip">{I.gitBranch} {tgt}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Processes card */}
      <div className="card" style={{padding:0,overflow:'hidden',flex:1,minHeight:0,display:'flex',flexDirection:'column'}}>
        <div className="inst-table-head">
          <div>
            <div style={{marginBottom:4}}>
              <span style={{fontWeight:700,fontSize:15,color:'#1f2733'}}>Processes with running instances</span>
            </div>
            <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,maxWidth:620}}>
              Review node mapping and set where active tokens should be placed after migration.
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#8c98a8',pointerEvents:'none'}}>{I.search}</span>
              <input
                style={{paddingLeft:32,paddingRight:10,height:34,border:'1px solid var(--border)',borderRadius:8,fontSize:13,width:220,outline:'none',background:'#fafbfc'}}
                placeholder="Search processes…"
                value={search}
                onChange={e=>setSearch(e.target.value)}
              />
            </div>
          </div>
        </div>

        {/* Readiness — interactive filter, mirrors Outcome on Migration Status */}
        <div style={{padding:'16px 22px',borderBottom:'1px solid var(--border)',background:'#fafbfc'}}>
          <div className="outcome-label" style={{marginBottom:8}}>
            <span>Readiness</span>
            <span className="outcome-total"><b>{total}</b> processes&nbsp;·&nbsp;{instCount} root instances <span className="info-icon" data-tooltip="Root instances are top-level process instances; child / subprocess instances are migrated together with their parent.">i</span></span>
          </div>
          <div className="outcome-bar" style={{marginBottom:12}}>
            <div style={{width:(readyN/total*100)+'%',background:'#1f7a4d'}}/>
            <div style={{width:(mappingN/total*100)+'%',background:'#e2a81c'}}/>
            <div style={{width:(notfoundN/total*100)+'%',background:'#d6453a'}}/>
          </div>
          <div className="outcome-stats-row">
            <span className="filter-lead">{I.filter} Filter:</span>
            {READY_STATS.map(s=>{
              const active = statusFilter===s.key;
              const empty = s.n===0;
              return (
                <div className={'outcome-stat'+(active?' sel':'')+(empty?' disabled':'')} key={s.key}
                  onClick={empty?undefined:()=>setStatusFilter(f=>f===s.key?null:s.key)}
                  title={empty?'No processes in this state':undefined}
                  style={active ? {background:s.bg, borderColor:s.dot} : undefined}>
                  <div className="outcome-dot" style={{background:s.dot}}/>
                  <span className="ol">{s.label}</span>
                  <span className="ov">{s.n}</span>
                  {active && <span className="chip-clear" style={{color:s.dot}}>×</span>}
                </div>
              );
            })}
          </div>
        </div>

        {/* Process list */}
        <div style={{padding:'16px 22px 20px',flex:1,minHeight:0,overflowY:'auto'}}>
        {procs.length===0 && (
          <div style={{padding:'22px 0',textAlign:'center',color:'var(--muted)',fontSize:13}}>No processes match the current filter.</div>
        )}
        {procs.map(p=>{
          const st = MIG_STATUS[effStatus(p)];
          const isOpen = !!open[p.id];
          return (
            <div className="mig-proc-card" key={p.id}>
              <div className="mig-proc-head" onClick={()=>tog(p.id)}>
                <span style={{fontWeight:600,fontSize:14,color:'#1f2733'}}>{p.name}</span>
                <span className="mig-pbadge">{p.badgeIcon==='box'?I.box:I.folder} {p.badge}</span>
                <span style={{flex:1}}/>
                <span className="mig-status-pill" style={{background:st.bg,color:st.color}}>{I[st.icon]} {st.label}</span>
                <span className={'pchev'+(isOpen?' open':'')}>{I.chev}</span>
              </div>
              {isOpen && (
                <div className="mig-proc-body">
                  {p.status==='notfound'
                    ? <NotFoundBody p={p} src={src} tgt={tgt} choice={choiceOf(p.id)} onChoice={(v)=>setNotFound(s=>({...s,[p.id]:v}))}/>
                    : <ProcessCardBody p={p} src={src} tgt={tgt} sel={mapSel[p.id]||{}} onSel={(idx,val)=>setSel(p.id,idx,val)}/>}
                </div>
              )}
            </div>
          );
        })}
        </div>
      </div>

      {/* Footer */}
      <div style={{display:'flex',justifyContent:'flex-end',alignItems:'center',marginTop:18,gap:10}}>
        <button className="btn-ghost" onClick={onCancel}>Cancel</button>
        <button className="btn-blue" onClick={onContinue}>Check Operation Summary {I.arrowR}</button>
      </div>
    </div>
  );
}

function MigrationDetailPage({ mig, onBack }){
  const { srcBuild, tgtBuild, opId, ts } = mig;
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState({ col:'status', dir:'asc' });   // status asc = errors first
  const [colFilters, setColFilters] = useState({ procName:[], status:[], details:[] });
  const [openFilter, setOpenFilter] = useState(null);
  const [visible, setVisible] = useState(10);

  const success = MOCK_INSTANCES.filter(r=>r.status==='Success').length;
  const failed  = MOCK_INSTANCES.filter(r=>r.status==='Failed').length;
  const total   = MOCK_INSTANCES.length;
  const procCount = new Set(MOCK_INSTANCES.map(r=>r.procName)).size;
  const pctS = Math.round(success/total*100);
  const pctF = 100 - pctS;

  const distinct = col => [...new Set(MOCK_INSTANCES.map(r=>r[col]))];
  const toggleColFilter = (col, v) => setColFilters(f=>{
    const cur = f[col]; const next = cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v];
    return {...f, [col]:next};
  });
  const toggleSort = col => setSort(s => s.col===col ? {col, dir: s.dir==='asc'?'desc':'asc'} : {col, dir:'asc'});

  const filtered = MOCK_INSTANCES.filter(r=>
    (!search || r.id.includes(search) || r.procName.includes(search.toLowerCase())) &&
    (colFilters.procName.length===0 || colFilters.procName.includes(r.procName)) &&
    (colFilters.status.length===0   || colFilters.status.includes(r.status)) &&
    (colFilters.details.length===0  || colFilters.details.includes(r.details))
  );
  const statusRank = s => s==='Failed' ? 0 : 1;   // errors first
  const sorted = [...filtered].sort((a,b)=>{
    let r = 0;
    if (sort.col==='status')        r = statusRank(a.status) - statusRank(b.status);
    else if (sort.col==='procName') r = a.procName.localeCompare(b.procName);
    else if (sort.col==='details')  r = a.details.localeCompare(b.details);
    return sort.dir==='desc' ? -r : r;
  });
  const shown = sorted.slice(0, visible);

  // reset the infinite-scroll window whenever the result set changes
  useEffect(()=>{ setVisible(10); }, [search, sort, colFilters]);
  // load more rows as the table scrolls toward the bottom
  const onTableScroll = e => {
    const el = e.currentTarget;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 80) setVisible(v=>Math.min(v+10, sorted.length));
  };

  const thStyle = {padding:'10px 14px',textAlign:'left',fontWeight:600,fontSize:11.5,color:'#697586',letterSpacing:'.04em',textTransform:'uppercase',whiteSpace:'nowrap',background:'#f7f8fa',borderBottom:'1px solid var(--border)'};
  const ColHeader = ({col, label}) => {
    const active = sort.col===col;
    const fActive = colFilters[col].length>0;
    return (
      <th style={{...thStyle, textTransform:'none', letterSpacing:0}}>
        <div className="col-head-cell">
          <span className="col-sort" onClick={()=>toggleSort(col)}>
            {label}
            <span className={'sarrow'+(active&&sort.dir==='asc'?' sarrow-asc':'')} style={{color: active?'var(--blue)':'#c2cad4'}}>{I.caret}</span>
          </span>
          <span className={'col-filter-btn'+(fActive?' active':'')} onClick={()=>setOpenFilter(o=>o===col?null:col)}>{I.filter}</span>
          {openFilter===col && (
            <div className="col-filter-dd">
              {distinct(col).map(v=>(
                <label className="col-filter-item" key={v}>
                  <input type="checkbox" checked={colFilters[col].includes(v)} onChange={()=>toggleColFilter(col,v)} />
                  <span>{v||'—'}</span>
                </label>
              ))}
              {fActive && <button className="col-filter-clear" onClick={()=>setColFilters(f=>({...f,[col]:[]}))}>Clear filter</button>}
            </div>
          )}
        </div>
      </th>
    );
  };

  const startTs = ts ? new Date(ts) : new Date('2025-10-07T23:40:00');
  const endTs   = new Date(startTs.getTime() + 8431);
  const fmtDate = (d) => d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ', ' +
    d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true}).replace(/^0/,'').replace(' am',' AM').replace(' pm',' PM');
  const durMs = endTs - startTs;
  const durStr = durMs < 60000 ? `${Math.round(durMs/1000)}s` : `${Math.round(durMs/60000)}m ${Math.round((durMs%60000)/1000)}s`;

  return (
    <div style={{padding:'24px 28px',flex:1,overflowY:'auto',minHeight:0}}>
      {/* Breadcrumb */}
      <div className="mig-detail-breadcrumb">
        <button className="back-btn" onClick={onBack}>{I.arrowL} Corrective Actions</button>
        <span className="sep">/</span>
        <span className="crumb-cur">Migration <span className="crumb-id">{opId||'e4d7d1a2'}…</span></span>
      </div>

      {/* Summary card */}
      <div className="mig-summary-card">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'24px 28px',gap:24}}>
          {/* Left: title + meta */}
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:12,margin:'0 0 10px 0',flexWrap:'wrap'}}>
              <h2 style={{fontSize:20,fontWeight:700,color:'#1f2733',margin:0}}>Migration Status</h2>
              <OpStatusPill status={mig.state==='COMPLETED'?'Completed':mig.state==='FAILED'?'Failed':'In Progress'} state={mig.state} />
            </div>
            <div className="mig-meta-row">
              <div className="mig-meta-item">
                <span style={{fontSize:11,fontWeight:700,color:'#8c98a8',letterSpacing:'.04em'}}>Operation ID</span>
                <b>{opId||'e4d7d1a2'}</b>
                <span style={{color:'#8c98a8',cursor:'pointer',display:'inline-flex'}}>{I.copy}</span>
              </div>
              <div className="mig-meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <span>{fmtDate(startTs)}</span>
              </div>
              <div className="mig-meta-item">
                {I.clock}
                <span>Ran in {durStr}</span>
              </div>
            </div>
          </div>
          {/* Right: build chips */}
          <div className="mig-build-row" style={{flexShrink:0}}>
            <div className="mig-build-box">
              <div className="mig-build-label">Source Build</div>
              <div className="mig-build-chip">{I.gitBranch} {srcBuild}</div>
            </div>
            <div style={{color:'#8c98a8',margin:'0 4px',paddingTop:20}}>{I.arrowR}</div>
            <div className="mig-build-box">
              <div className="mig-build-label">Target Build</div>
              <div className="mig-build-chip">{I.gitBranch} {tgtBuild}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Instances table */}
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div className="inst-table-head">
          <div>
            <div style={{marginBottom:4}}>
              <span style={{fontWeight:700,fontSize:15,color:'#1f2733'}}>Process Instances</span>
            </div>
            <div style={{fontSize:12.5,color:'var(--muted)',whiteSpace:'nowrap'}}>
              Per-instance result of this migration run. Failed instances can be retried individually.
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#8c98a8',pointerEvents:'none'}}>{I.search}</span>
              <input
                style={{paddingLeft:32,paddingRight:10,height:34,border:'1px solid var(--border)',borderRadius:8,fontSize:13,width:220,outline:'none',background:'#fafbfc'}}
                placeholder="Search instances…"
                value={search}
                onChange={e=>{setSearch(e.target.value);setPage(1);}}
              />
            </div>
          </div>
        </div>

        {/* Outcome — between header and table */}
        <div style={{padding:'16px 22px',borderBottom:'1px solid var(--border)',background:'#fafbfc'}}>
          <div className="outcome-label" style={{marginBottom:8}}>
            <span>Outcome</span>
            <span className="outcome-total"><b>{total}</b> instances <span style={{color:'var(--muted)',fontWeight:400}}>({procCount} processes&nbsp;·&nbsp;{ROOT_INSTANCES} root instances)</span></span>
          </div>
          <div className="outcome-bar" style={{marginBottom:12}}>
            <div style={{width:pctS+'%',background:'#1f7a4d'}}/>
            <div style={{width:pctF+'%',background:'#d6453a'}}/>
          </div>
          <div className="outcome-stats-row">
            <span className="filter-lead">{I.filter} Filter:</span>
            {[
              {label:'Success', n:success, pct:pctS, dot:'#1f7a4d', bg:'#e7f6ee'},
              {label:'Failed',  n:failed,  pct:pctF, dot:'#d6453a', bg:'#fdeceb'},
            ].map(s=>{
              const active = colFilters.status.includes(s.label);
              return (
                <div
                  className={'outcome-stat'+(active?' sel':'')}
                  key={s.label}
                  onClick={()=>toggleColFilter('status', s.label)}
                  style={active ? {background:s.bg, borderColor:s.dot} : undefined}
                >
                  <div className="outcome-dot" style={{background:s.dot}}/>
                  <span className="ol">{s.label}</span>
                  <span className="ov">{s.n}</span>
                  <span className="op">({s.pct}%)</span>
                  {active && <span className="chip-clear" style={{color:s.dot}}>×</span>}
                </div>
              );
            })}
          </div>
        </div>

        <div onScroll={onTableScroll} style={{maxHeight:380,overflowY:'auto',overflowX:'auto'}}>
        <table style={{width:'100%',minWidth:680,borderCollapse:'collapse',fontSize:13}}>
          <thead style={{position:'sticky',top:0,zIndex:1}}>
            <tr style={{background:'#f7f8fa',borderBottom:'1px solid var(--border)'}}>
              <th style={thStyle}>Process Instance UUID</th>
              <ColHeader col="procName" label="Process Name"/>
              <ColHeader col="status" label="Status"/>
              <ColHeader col="details" label="Details"/>
              <th style={thStyle}>Migrated At</th>
            </tr>
          </thead>
          <tbody>
            {shown.map((r)=>(
              <tr key={r.id} style={{borderBottom:'1px solid #f0f2f5',transition:'background .12s'}}
                  onMouseEnter={e=>e.currentTarget.style.background='#fafbff'}
                  onMouseLeave={e=>e.currentTarget.style.background=''}>
                <td style={{padding:'11px 14px',fontFamily:'SF Mono,ui-monospace,monospace',fontSize:12,color:'#697586'}}>{r.id.slice(0,20)}…</td>
                <td style={{padding:'11px 14px',fontWeight:500,color:'#222b38'}}>{r.procName}</td>
                <td style={{padding:'11px 14px'}}><InstStatusPill status={r.status}/></td>
                <td style={{padding:'11px 14px',color:r.details==='-'?'#8c98a8':r.status==='Failed'?'#c0392b':'#9a6a16',fontSize:12.5}}>{r.details}</td>
                <td style={{padding:'11px 14px',color:'#697586',whiteSpace:'nowrap'}}>{r.migratedAt}</td>
              </tr>
            ))}
            {shown.length===0 && (
              <tr><td colSpan={5} style={{padding:'26px 14px',textAlign:'center',color:'var(--muted)',fontSize:13}}>No instances match the current filters.</td></tr>
            )}
          </tbody>
        </table>
        </div>
        <div className="inst-footer">
          <span>Showing <b>{shown.length}</b> of {sorted.length} instances{sorted.length!==total ? ` (filtered from ${total})` : ''}</span>
          <span style={{color:'var(--muted)'}}>{total} instances total</span>
        </div>
      </div>

      {openFilter && <div onClick={()=>setOpenFilter(null)} style={{position:'fixed',inset:0,zIndex:55}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
