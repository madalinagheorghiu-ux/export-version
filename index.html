<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowX — Export / Download / Notifications prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Open Sans is the FlowX primary typeface; it isn't installed by default, so load it. -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // Force the classic JSX runtime (React.createElement) so the inline script
  // runs as a classic script — the automatic runtime emits `import`, which fails.
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets.react, { runtime: 'classic' }]]
  });
</script>
<style>
  :root{
    --bg:#f4f5f7; --panel:#fff; --header:#0e1422; --header-line:#222c3e;
    --text:#1f2733; --muted:#697586; --faint:#9aa4b2; --border:#e6e8ec; --border-2:#eef0f3;
    --blue:#1f6feb; --blue-700:#1a5fd0; --blue-soft:#eaf1fe;
    --amber-bg:#fdf7e6; --amber-bd:#f0e0ad; --amber-bar:#e9b949; --amber-text:#8a6a16;
    --green:#2e9e6b; --yellow:#e7b008; --red:#e0584d;
    --shadow:0 6px 22px rgba(16,24,40,.13);
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%}
  /* Open Sans is the FlowX primary typeface (loaded in <head>). */
  body{margin:0;font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;flex-direction:column;height:100%}

  /* ---------- Header ---------- */
  .header{height:54px;background:var(--header);display:flex;align-items:center;gap:14px;padding:0 16px;color:#dbe2ea;flex:0 0 auto;position:relative;z-index:60}
  .logo{width:30px;height:30px;border-radius:7px;background:#11161f;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;border:0;border-bottom:2px solid var(--amber-bar);padding:0;font-size:14px;cursor:pointer}
  .logo:hover{background:#1a2233}
  .crumb-proj{display:inline-flex;align-items:center;gap:5px}
  .crumb-proj svg{color:#8c98a8}
  .ws-badge{font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:6px;white-space:nowrap}
  .ws-badge.sandbox{background:#1f6feb;color:#fff}
  .ws-badge.staging{background:#f0b429;color:#503c05}
  .ws-badge.production{background:#3a4250;color:#fff}
  .ws-badge.sm{font-size:9.5px;padding:1px 7px;border-radius:5px}
  /* workspace switcher */
  .ws-menu{position:absolute;top:42px;left:0;width:306px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:80;padding:14px 14px 10px}
  .ws-brand{text-align:center;font-weight:800;font-size:18px;color:#11161f;letter-spacing:-.01em;margin:2px 0 12px}
  .ws-brand span{border-bottom:3px solid var(--amber-bar);padding-bottom:1px}
  .ws-search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--faint);margin-bottom:8px}
  .ws-search input{border:0;outline:0;flex:1;font-size:13px;color:var(--text)}
  .ws-group{padding:2px 0}
  .ws-grouphead{display:flex;align-items:center;gap:8px;padding:8px 6px;cursor:pointer;border-radius:8px}
  .ws-grouphead:hover{background:#f5f7fa}
  .chev2{display:flex;color:#8c98a8;transition:transform .15s;transform:rotate(-90deg)}
  .chev2.open{transform:none}
  .ws-item{padding:8px 10px 8px 34px;font-size:13.5px;color:#3c4654;cursor:pointer;border-radius:8px}
  .ws-item:hover{background:#f5f7fa}
  .ws-item.sel{background:var(--blue-soft);color:var(--blue);font-weight:600}
  .crumb{color:#aeb8c6;font-size:13px}
  .crumb b{color:#eef2f6;font-weight:600}
  .branch-pill{display:flex;align-items:center;gap:8px;background:#161d2b;border:1px solid #2a3447;border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;transition:border-color .15s}
  .branch-pill:hover{border-color:#41506b}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
  .tok{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;line-height:1.4}
  .tok.main{background:#13233f;color:#7db0ff;border:1px solid #28456f}
  .tok.committed{background:#11301f;color:#5fcf8e;border:1px solid #1f5236}
  .tok.draft{color:#e8a14a;border:1px dashed #7a5a23;background:transparent}
  .tok.msg{color:#9aa4b2}
  .commit-btn{display:flex;align-items:center;gap:7px;background:#161d2b;border:1px solid #2a3447;color:#cfd8e3;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500}
  .commit-btn:hover{background:#1b2433}
  .spacer{flex:1}
  .seg{display:flex;background:#161d2b;border:1px solid #2a3447;border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:#8c98a8;padding:5px 12px;font-size:12.5px;font-weight:600}
  .seg button.on{background:var(--blue);color:#fff}
  .icon-btn{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;color:#aeb8c6;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:#161d2b;color:#fff}
  /* One-shot pulse: fires when an in-progress modal is backgrounded ("Close — keep working"),
     tying the dismissed modal to the bell as the place to re-check status. */
  @keyframes bell-pulse{
    0%   {box-shadow:0 0 0 0 rgba(31,111,235,.55)}
    70%  {box-shadow:0 0 0 11px rgba(31,111,235,0)}
    100% {box-shadow:0 0 0 0 rgba(31,111,235,0)}
  }
  .icon-btn.pulsing{color:#fff;animation:bell-pulse 1.1s ease-out 3}
  /* Unread indicator: an 8px dot, no count — "something is waiting", not "how much". The number
     lives one click away on the filter popover's Unread row. red-500 (#E62200, the DS `error`
     token); the header-coloured ring cuts it out from the bell glyph beneath. */
  .bell-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#E62200;box-shadow:0 0 0 2px var(--header)}
  .tooltip{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:#fff;color:#333;font-size:11px;padding:3px 8px;border-radius:6px;box-shadow:var(--shadow);white-space:nowrap;pointer-events:none}
  .avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#3a2e00}
  .avatar.af{background:#f6c344}.avatar.mg{background:#cdd4dd;color:#3a4250}.avatar.ck{background:#bcd3c4;color:#234}

  /* ---------- Body ---------- */
  .body{flex:1;display:flex;min-height:0}
  .sidebar{width:248px;background:#fff;border-right:1px solid var(--border);padding:10px 0;overflow:auto;flex:0 0 auto}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 18px;color:#3c4654;font-size:13.5px;cursor:pointer;font-weight:500}
  .nav-item:hover{background:#f7f8fa}
  .nav-item.on{background:var(--blue-soft);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
  .nav-item .ic{color:#8c98a8;display:flex}
  .nav-item.on .ic{color:var(--blue)}
  .nav-sub{padding:7px 18px 7px 47px;color:#5b6573;font-size:13px;cursor:pointer}
  .nav-sub:hover{background:#f7f8fa}
  .nav-sub.on{background:var(--blue-soft);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
  .nav-section{display:flex;align-items:center;gap:11px;padding:13px 18px 5px;color:#1f2733;font-size:13.5px;font-weight:700}
  .nav-section .ic{color:#5b6573;display:flex}
  .nav-group-label{font-size:11px;font-weight:700;letter-spacing:.05em;color:#9aa4b2;padding:14px 18px 4px;text-transform:uppercase}
  .content{flex:1;overflow:auto;padding:22px 26px}

  .card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm)}
  .page-head{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:16px}
  .page-head h1{margin:0;font-size:22px;font-weight:700}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:8px 12px;width:330px;color:var(--faint)}
  .search input{border:0;outline:0;flex:1;font-size:13.5px;color:var(--text)}
  .btn-blue{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .btn-blue:hover{background:var(--blue-700)}
  .btn-blue:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:#fff;color:#3c4654;border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-weight:600;display:flex;align-items:center;gap:7px;justify-content:center}
  .btn-ghost:hover{background:#f7f8fa}
  .kbd-hint{display:flex;align-items:center;gap:9px;background:#eef4ff;border:1px solid #d7e3ff;color:#2a5fb0;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:14px 18px;border-bottom:1px solid var(--border)}
  tbody td{padding:15px 18px;border-bottom:1px solid var(--border-2);font-size:14px}
  tbody tr:last-child td{border-bottom:0}
  .row-name{font-weight:500;color:#222b38}
  .who{display:flex;align-items:center;gap:9px;color:#3c4654}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .mini{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#697586;display:flex;align-items:center;justify-content:center}
  .mini:hover{background:#f5f6f8}

  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:var(--muted);text-align:center;gap:8px}
  .placeholder .big{font-size:18px;font-weight:600;color:#3c4654}

  /* ---------- Builds (runtime) ---------- */
  .builds-label{font-size:12px;font-weight:600;color:var(--muted);padding:16px 18px 8px}
  .build-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin:0 8px;border-radius:10px}
  .build-row:hover{background:#f7f8fa}
  .build-chip{display:inline-flex;align-items:center;gap:9px;background:#eef0f3;border-radius:9px;padding:9px 15px;font-weight:600;color:#33404f;font-size:14px}
  .build-chip svg{color:#7e8a9a}
  .ready-pill{display:inline-flex;align-items:center;gap:6px;background:#e7f6ee;color:#1f7a4d;border:1px solid #bce6cf;border-radius:8px;padding:6px 11px;font-weight:600;font-size:12px;white-space:nowrap}
  .ready-pill:hover{background:#dcf1e6}
  .tipwrap{position:relative;display:inline-flex}
  .tipwrap .tip{position:absolute;bottom:-32px;right:0;background:#1f2733;color:#fff;font-size:11px;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
  .tipwrap:hover .tip{opacity:1}

  /* ---------- Branching console overlay ---------- */
  .overlay{position:absolute;inset:54px 0 0 0;background:rgba(15,20,34,.28);z-index:40;display:flex}
  .console{position:absolute;inset:54px 0 0 0;background:#fff;z-index:41;display:grid;grid-template-columns:300px 1fr 360px;overflow:hidden}
  .vpanel{border-right:1px solid var(--border);padding:18px;overflow:auto;display:flex;flex-direction:column}
  .vpanel h3,.cpanel h3{margin:0 0 14px;font-size:15px;font-weight:700}
  .tagrow{display:flex;gap:7px;margin-bottom:10px}
  .vtag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px}
  .vtag.main{background:#eaf1fe;color:#1f6feb}
  .vtag.committed{background:#e7f6ee;color:#2e9e6b}
  .vtag.draft{color:#c9842a;border:1px dashed #e0b878;background:#fdf7e6}
  .meta{font-size:12.5px;color:var(--muted);margin:4px 0}
  .meta b{color:#3c4654;font-weight:600}
  .rc-title{font-size:13px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:6px}
  .rc{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;color:#546070}
  .rc-bar{width:4px;height:18px;border-radius:3px;flex:0 0 auto}
  .rc .nm{color:#222b38;font-weight:600}
  .vpanel .actions{margin-top:auto;display:flex;flex-direction:column;gap:9px;padding-top:18px}
  .center{padding:18px 22px;overflow:auto;background:#fcfcfd}
  .center .ttl{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .branch-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:8px}
  .branch-row.sel{outline:2px solid var(--blue);background:#f3f8ff}
  .branch-row:hover{background:#f5f7fa}
  .node{width:13px;height:13px;border-radius:50%;background:var(--blue);flex:0 0 auto;margin-left:6px}
  .node.draft{background:#fff;border:2px dashed #e0a64a}
  .node.orange{background:#e9a23b}
  .vline{flex:1}
  .vername{display:flex;align-items:center;gap:8px}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px}
  .pill.main{background:#eaf1fe;color:#1f6feb}
  .pill.ver{background:#eef0f3;color:#546070;display:flex;align-items:center;gap:4px}
  .pill.test{background:#fcf3d6;color:#9a7a16}
  .pill.hotfix{background:#fcf3d6;color:#9a7a16}
  .pill.draftp{color:#c9842a;border:1px dashed #e0b878}
  .cpanel{border-left:1px solid var(--border);padding:18px;overflow:auto}
  .cpanel .crow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border-2);font-size:13px}
  .crow .msg{color:#3c4654;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- Modal ---------- */
  .modal-scrim{position:fixed;inset:0;background:rgba(15,20,34,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:540px;max-width:100%;max-height:90vh;overflow:auto}
  .modal .mhead{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 26px 6px;position:relative}
  .modal .mhead h2{margin:0;font-size:21px;font-weight:700}
  .mclose{position:absolute;top:18px;right:18px;border:0;background:transparent;color:#9aa4b2;width:30px;height:30px;border-radius:8px}
  .mclose:hover{background:#f2f3f5;color:#555}
  .mbody{padding:8px 26px 22px}
  .dl-ctx{display:flex;align-items:center;gap:8px;margin-top:8px}
  .dl-ctx-t{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
  .dl-ctx-t svg{color:#9aa4b2;vertical-align:-2px}
  .infobox{display:flex;gap:10px;background:#f7f8fa;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:#546070;font-size:12.7px;line-height:1.5;margin:10px 0 20px}
  .infobox.amber{background:var(--amber-bg);border-color:var(--amber-bd);color:#7a5f18}
  .field-label{font-size:13.5px;font-weight:600;margin-bottom:7px}
  .select{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;cursor:pointer;background:#fff}
  .select:hover{border-color:#c7cdd6}
  .select .cur{font-size:11px;font-weight:600;color:#697586;background:#eef0f3;border-radius:6px;padding:2px 8px;margin-right:8px}
  .help{font-size:12px;color:var(--muted);margin:7px 0 0}
  .dd{border:1px solid var(--border);border-radius:10px;margin-top:6px;box-shadow:var(--shadow-sm);overflow:hidden}
  .dd-item{padding:11px 14px;font-size:14px;display:flex;align-items:center;justify-content:space-between;position:relative}
  .dd-item:hover{background:#f5f7fa;cursor:pointer}
  .dd-item.sel{background:#eaf1fe;color:var(--blue)}
  .dd-item.disabled{cursor:not-allowed;opacity:1}
  .dd-item.disabled:hover{background:transparent}
  .dd-item.disabled .build-ver{color:#b0b8c4}
  .dd-item.disabled .build-ver svg{color:#c8d0da}
  .dd-item-no-inst{font-size:11px;color:#b0b8c4;font-style:italic;margin-left:8px;white-space:nowrap}
  .dd-item[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#1f2733;color:#fff;padding:5px 10px;border-radius:6px;font-size:11.5px;white-space:nowrap;z-index:200;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .info-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.5px solid #6b7280;font-size:10px;color:#6b7280;cursor:default;font-style:normal;font-weight:600;margin-left:4px;vertical-align:middle;position:relative}
  .info-icon[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);background:#1f2733;color:#fff;padding:5px 10px;border-radius:6px;font-size:11.5px;white-space:nowrap;z-index:200;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .info-icon.wrap[data-tooltip]:hover::after{white-space:normal;width:260px;text-align:left;line-height:1.45;font-weight:400}
  .toggle-row{display:flex;align-items:center;gap:11px;margin-top:22px}
  .switch{width:38px;height:22px;border-radius:999px;background:#cdd4dd;position:relative;transition:background .15s;border:0;flex:0 0 auto}
  .switch.on{background:var(--blue)}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.on .knob{left:18px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}

  /* processing */
  .proc{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 10px 6px}
  .spinner{width:42px;height:42px;border-radius:50%;border:4px solid #e6ebf2;border-top-color:var(--blue);animation:spin 1s linear infinite;margin-bottom:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .proc h3{margin:0 0 6px;font-size:17px}
  .proc p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;max-width:360px}
  .progress{width:100%;height:6px;background:#eef0f3;border-radius:999px;overflow:hidden;margin:20px 0 6px}
  .progress .bar{height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
  .sim-note{font-size:11.5px;color:var(--faint);margin-top:4px}

  /* excluded panel */
  .excl-head{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px;margin:18px 0 4px}
  .excl-head .cnt{color:var(--muted);font-weight:600}
  .excl-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--border-2);font-size:14px}
  .excl-row:last-child{border-bottom:0}
  .excl-bar{width:4px;height:20px;border-radius:3px;background:#cfd5de;flex:0 0 auto}
  .excl-path{color:var(--muted)}
  .excl-path b{color:#1f2733;font-weight:700}
  .ok-banner{display:flex;gap:10px;align-items:center;background:#e9f7ef;border:1px solid #bce6cf;color:#1f7a4d;border-radius:10px;padding:13px 15px;font-size:13.5px}

  /* ---------- Bell panel ---------- */
  /* ---- Notification panel sizing — fixed 21:26 (w:h) at every tier; see spec §5.1 ----
     Height is the binding constraint on a laptop, so the tier switches on viewport HEIGHT.
     Baseline is the MacBook Pro 16" (~1000px viewport) at 420 × 520. */
  :root{ --np-w:420px; --np-h:520px; }                                  /* M — baseline (MBP 16") */
  @media (max-height:899px){  :root{ --np-w:380px; --np-h:470px; } }    /* S — 13" laptops */
  @media (min-height:1150px){ :root{ --np-w:460px; --np-h:570px; } }    /* L — large / external */
  .bell-panel{position:absolute;top:50px;right:10px;
    width:var(--np-w);height:var(--np-h);
    max-height:calc(100vh - 72px);max-height:calc(100dvh - 72px);       /* never reach the screen edge */
    display:flex;flex-direction:column;
    background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:70;overflow:hidden}
  /* Below ~520px the dropdown can't hold the ratio without overflowing — it becomes a near-full-width
     sheet instead. Deliberate: the ratio serves a bell-anchored panel, not a phone-width one. */
  @media (max-width:519px){
    .bell-panel{width:calc(100vw - 24px);right:12px;height:auto;max-height:70dvh}
  }
  .bp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .bp-head h4{margin:0;font-size:14.5px}
  .bp-head button{border:0;background:transparent;color:var(--blue);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:7px}
  .bp-head button:hover:not(:disabled){background:#f5f7fa}
  .bp-head button:disabled{color:#b6bfca;cursor:default}
  .bp-section{font-size:11px;font-weight:700;letter-spacing:.05em;color:#9aa4b2;text-transform:uppercase;padding:12px 16px 6px;background:#fafbfc;border-bottom:1px solid var(--border-2)}
  .bp-search-row{display:flex;align-items:center;gap:8px;margin:12px 14px 8px}
  .bp-search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--faint)}
  .bp-filter{position:relative;flex:0 0 auto}
  .bp-filter-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--border);border-radius:9px;background:#fff;color:#697586}
  .bp-filter-btn:hover{background:#f5f7fa}
  .bp-filter-btn.active{background:var(--blue-soft);border-color:#cfe0ff;color:var(--blue)}
  .bp-filter-btn svg{width:15px;height:15px}
  .bp-search svg{flex:0 0 auto}
  .bp-search input{border:0;outline:0;flex:1;min-width:0;font-size:13px;color:var(--text);background:transparent;order:-1}
  .bp-search-clear{border:0;background:transparent;color:#c2cad4;display:flex;align-items:center;justify-content:center;padding:0;width:18px;height:18px;border-radius:5px}
  .bp-search-clear:hover{background:#eef0f3;color:#697586}
  .bp-search-clear svg{width:13px;height:13px}
  .filter-dd-backdrop{position:fixed;inset:0;z-index:78}
  .filter-dd-menu{position:absolute;top:42px;left:0;z-index:79;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:5px;width:175px}
  .filter-dd-menu.right{left:auto;right:0}
  /* min-height keeps a pill row the same height as a text row — the pill is shorter than a
     line of label text, and the popover should hold one rhythm across the divider.
     (border-box, so this is the full row height, not the content box.) */
  .filter-dd-item{display:flex;align-items:center;gap:9px;min-height:33px;padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:#3c4654;cursor:pointer;white-space:nowrap}
  .filter-dd-item:hover{background:#f4f5f7}
  .filter-dd-item.sel{background:var(--blue-soft);color:var(--blue);font-weight:600}
  .filter-dd-lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#9aa4b2;padding:7px 10px 3px}
  .filter-dd-div{height:1px;background:var(--border-2);margin:5px 6px}
  /* Plain right-aligned figure, not a badge — it annotates the row, it isn't a second alarm. */
  .dd-count{margin-left:auto;font-size:12px;font-weight:600;color:var(--faint)}
  .filter-dd-item.sel .dd-count{color:var(--blue)}
  .bp-foot{display:flex;align-items:center;gap:7px;padding:9px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint);background:#fafbfc}
  .bp-foot svg{width:13px;height:13px;flex:0 0 auto}
  .bp-foot-link{margin-left:auto;color:var(--blue);font-weight:600;text-decoration:none}
  .bp-foot-link:hover{text-decoration:underline}
  .fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:#546070}
  .fchip:hover{background:#f5f7fa}
  .fchip.on{background:var(--blue-soft);border-color:#cfe0ff;color:var(--blue)}
  .fcount{font-size:11px;font-weight:700;color:var(--faint)}
  .fchip.on .fcount{color:var(--blue)}
  /* The list is the only flexible band — header, search and footer keep their intrinsic height. */
  .nlist{flex:1 1 auto;min-height:0;overflow:auto;border-top:1px solid var(--border)}
  /* Holding a stable empty state instead of a list: centre it. The panel keeps its tier height
     (it must not resize as a search narrows to nothing), and a line pinned to the top of that
     height reads as "failed to load" rather than "nothing here". A list stays top-aligned — and
     so does the no-search-results message, which is live feedback on typing and must sit where
     a result would rather than jumping to the middle on the keystroke that empties the list. */
  .nlist.is-empty{display:flex;align-items:center;justify-content:center}
  .nitem{padding:12px 14px;border-bottom:1px solid var(--border-2)}
  /* Layout: status disc in a fixed left column; everything else stacks full-width beside it —
     title+time, context, subtitle, then the action underneath. */
  .nmain{display:flex;align-items:flex-start;gap:10px}
  /* A single 4px rhythm between every band: title → context → body → CTA. */
  .nbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .nline1{display:flex;align-items:flex-start;gap:8px}
  /* Title — 14/22 semibold */
  /* Title is always ONE line — it's the scan target, so a wrapping title would push the
     context/body/CTA bands down and break the feed's even rhythm. Overflow ellipsises and
     the full string is exposed on hover (tooltip added only when it actually truncates). */
  .nitem .t, .toast .t{flex:1;min-width:0;font-size:14px;line-height:22px;font-weight:600;color:#1D232C;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nctx-row{display:flex;align-items:center;gap:7px;min-width:0}
  /* Body details — 12/18 regular */
  .nitem .s, .toast .s,
  .nitem .nmeta, .toast .nmeta{font-size:12px;line-height:18px;font-weight:400;color:#64748B}
  .nitem .s, .toast .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
  /* The failure cause is the one body line that carries title-weight colour — it's the substance
     of the notification, not a secondary detail. Still regular weight; it wraps. */
  .nitem .s.nfail, .toast .s.nfail{color:#1D232C;white-space:normal;margin:0}
  .nact{display:flex}
  .nitem:hover{background:#fafbfc}
  /* Unread is carried by the fill alone — no left accent bar. */
  .nitem.unread{background:#f3f8ff}
  .nmeta{font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nproj{display:inline-flex;align-items:center;gap:4px;vertical-align:bottom}
  .nproj svg{color:#9aa4b2;vertical-align:-2px}
  .n-actions{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:22px}
  .ntime{font-size:11.5px;color:var(--faint);white-space:nowrap;flex:0 0 auto;margin-top:1px}
  .ndismiss{border:0;background:transparent;color:#c2cad4;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0}
  .ndismiss:hover{background:#eef0f3;color:#697586}
  .ndismiss svg{width:14px;height:14px}
  .n-markread{border:0;background:transparent;color:#c2cad4;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;opacity:0;transition:opacity .12s}
  .n-markread svg{width:14px;height:14px}
  .n-markread:hover{background:#eef0f3;color:#697586}
  .nitem:hover .n-markread{opacity:1}
  /* Status marker — a 24px tinted disc with a 16px glyph inside. The tint is very low-contrast
     so a column of them still reads as calm rather than as a traffic light. */
  .nicon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         flex:0 0 auto;margin-top:1px}
  .nicon svg{width:16px;height:16px}
  .nicon.ok{color:#2e9e6b;background:#e7f4ed}
  .nicon.warn{color:#c2921f;background:#fcf1dc}
  .nicon.err{color:#d6453a;background:#fbe8e5}
  .nicon.info{color:#3a5fb0;background:#e9eefb}
  .nicon.proc{color:#8a94a3;background:#eef0f3}
  /* Failure cause: wraps (it's a sentence, not a label) and stays muted so the red icon carries the alarm. */
  .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .nctx{display:flex;align-items:center;gap:7px;margin-top:5px}
  .nctx-t{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
  .nctx-t svg{color:#9aa4b2}
  /* Tertiary: text + icon only. Negative inset so the label optically aligns with the text above it. */
  .nbtn{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:7px;
        padding:4px 7px;margin-left:-7px;font-weight:600;color:var(--blue);font-size:12.5px;white-space:nowrap;cursor:pointer}
  .nbtn:hover{background:var(--blue-soft)}
  .nitem .nbtn, .toast .nbtn{font-size:12px;line-height:18px;font-weight:600;color:#006BD8}
  .nbtn svg{width:15px;height:15px;flex:none}
  .nbtn.warn{color:#b6891f;border-color:#ecd9a3}
  .nbtn.warn:hover{background:var(--amber-bg)}
  .nproc{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
  /* THE in-progress spinner. One component, one size, used wherever an operation is running:
     the Corrective Actions "In Progress" pill (the reference), the feed row's status glyph and
     its action slot. No per-call-site size overrides — they drift. */
  .mini-spin{width:12px;height:12px;border-radius:50%;border:2px solid #d6dbe2;border-top-color:#8a94a3;animation:spin .9s linear infinite;display:inline-block;flex:none}
  .exp-list{max-height:210px;overflow:auto;padding-bottom:6px}
  .erow{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:12.7px;border-bottom:1px solid var(--border-2)}
  .erow .ei{flex:1;min-width:0}
  .erow .et{font-weight:600;color:#222b38;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .erow .es{color:var(--muted);font-size:11.5px;margin-top:1px}
  .chip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .chip.proc{background:#eef0f3;color:#697586}
  .chip.ready{background:#e7f6ee;color:#2e9e6b}
  .chip.excl{background:var(--amber-bg);color:#b6891f}
  .chip.fail{background:#fdeceb;color:#d6453a}
  .chip.cache{background:#eef4ff;color:#3a5fb0}
  .erow .dl{border:1px solid var(--border);background:#fff;border-radius:7px;padding:5px 9px;font-weight:600;color:var(--blue);font-size:11.5px;display:flex;align-items:center;gap:5px}
  .erow .dl:hover{background:#f5f7fa}
  /* Regular 14/22, neutrals-500 #64748B (text-secondary). Font inherited from body — no
     family override here, per the spec's rule against restating type at the call site. */
  .empty{padding:26px 16px;text-align:center;font-weight:400;font-size:14px;line-height:22px;color:#64748B}

  /* ---------- Toasts ---------- */
  /* Bottom-anchored column: the newest toast is appended last, so it sits closest to the corner
     and later arrivals never push it off-screen. Capped at TOAST_MAX (§5.5.1). */
  .toasts{position:fixed;right:18px;bottom:56px;z-index:90;display:flex;flex-direction:column;gap:10px;width:360px}
  /* A toast reuses the feed item's bands (.nmain/.nicon/.nbody/.nline1/.nctx-row/.s/.nbtn);
     only the card and its status-matched left accent are toast-specific. */
  .toast{background:#fff;border:1px solid var(--border);border-left:4px solid var(--green);border-radius:11px;box-shadow:var(--shadow);padding:12px 14px;display:block;animation:slidein .25s ease}
  .toast.ok{border-left-color:var(--green)} .toast.warn{border-left-color:var(--amber-bar)} .toast.err{border-left-color:var(--red)}
  @keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- Confirm-leave modal ---------- */
  .confirm-scrim{position:fixed;inset:0;background:rgba(15,20,34,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .confirm-box{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:420px;max-width:100%;padding:24px 24px 22px;text-align:center}
  .confirm-icon{width:46px;height:46px;border-radius:50%;background:var(--amber-bg);color:#b6891f;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .confirm-box h3{margin:14px 0 8px;font-size:18px;font-weight:700}
  .confirm-box p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
  .confirm-actions{display:flex;gap:10px;justify-content:center;margin-top:22px}
  .btn-danger{background:var(--red);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:600}
  .btn-danger:hover{background:#cf4433}

  /* ---------- Prototype stamp ---------- */
  .proto-stamp{position:fixed;right:16px;bottom:16px;z-index:50;font-size:11px;font-weight:600;color:#8a94a3;background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 11px;box-shadow:var(--shadow-sm);opacity:.9}

  /* ---------- Corrective Actions ---------- */
  .status-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .status-pill.in-progress{background:#e7e9f0;color:#3c4654}
  .status-pill.completed{background:#e6f4ec;color:#2e7d52}
  .status-pill.failed{background:#fbe7e3;color:#cf4332}
  .ca-op-id{font-family:'SF Mono',ui-monospace,monospace;font-size:12px;color:#697586;display:flex;align-items:center;gap:5px}
  .build-ver{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#33404f}
  .build-ver svg{color:#7e8a9a}
  .dropdown-wrap{position:relative}
  .dropdown-menu{position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:50;min-width:210px;padding:6px 0;overflow:hidden}
  .dropdown-item{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13.5px;color:#3c4654;cursor:pointer}
  .dropdown-item:hover{background:#f5f7fa}
  .mig-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .mig-subtitle{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
  .mig-group{margin-bottom:2px}
  .mig-group-head{display:flex;align-items:center;gap:8px;padding:11px 0;cursor:pointer;font-size:13.5px;font-weight:600;color:#1f2733;border-bottom:1px solid var(--border-2);user-select:none}
  .mig-group-head .gc{margin-left:auto;color:var(--muted);font-weight:400;font-size:13px;padding-right:4px}
  .mig-chev{display:inline-flex;color:#8c98a8;transition:transform .15s}
  .mig-chev.open{transform:rotate(0deg)}
  .mig-chev.closed{transform:rotate(-90deg)}
  .mig-subgroup{display:flex;align-items:center;font-size:11.5px;font-weight:700;color:#8c98a8;letter-spacing:.03em;text-transform:uppercase;margin:14px 0 4px}
  .mig-proc-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 10px 22px;border-bottom:1px solid var(--border-2);font-size:13px;gap:12px}
  .mig-proc-row:last-child{border-bottom:0}
  .mig-proc-name{display:flex;align-items:center;gap:8px;font-weight:500;color:#222b38;min-width:0}
  .mig-proc-desc{color:var(--muted);font-size:12.5px;white-space:nowrap}
  /* Bulk Migration Summary — plan cards */
  .build-pill{display:inline-flex;align-items:center;gap:5px;background:#e9edf1;border-radius:7px;padding:3px 10px;font-size:14px;font-weight:600;color:#3c4654}
  .build-pill svg{color:#7e8a9a}
  .mig-sum-card{background:#f6f7f9;border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:14px}
  .mig-sum-card:last-of-type{margin-bottom:0}
  .mig-sum-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .mig-sum-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:#1f2733}
  .mig-sum-count{margin-left:auto;font-size:14px;font-weight:700;color:#1f2733;white-space:nowrap}
  .mig-sum-body{margin-top:8px;margin-left:6px;padding-left:16px;border-left:2px solid #dfe3e8}
  .mig-sum-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 2px;font-size:14px}
  .mig-sum-row .nm{display:flex;align-items:center;gap:10px;font-weight:600;color:#2b3543;min-width:0}
  .mig-sum-row .nm svg{color:#7e8a9a;flex-shrink:0}
  .mig-sum-row .ds{color:var(--muted);font-size:13.5px;text-align:right}

  /* ---------- Migration detail page ---------- */
  .mig-detail-breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13.5px}
  .mig-detail-breadcrumb .back-btn{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);padding:4px 8px 4px 0;cursor:pointer;font-size:13.5px}
  .mig-detail-breadcrumb .back-btn:hover{color:var(--text)}
  .mig-detail-breadcrumb .sep{color:#c2cad4}
  .mig-detail-breadcrumb .crumb-link{color:var(--muted);cursor:pointer}
  .mig-detail-breadcrumb .crumb-link:hover{color:var(--blue)}
  .mig-detail-breadcrumb .crumb-cur{font-weight:600;color:var(--text)}
  .mig-detail-breadcrumb .crumb-id{font-family:'SF Mono',ui-monospace,monospace;font-size:12px;color:var(--muted)}
  .mig-summary-card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm);padding:0;margin-bottom:16px;display:flex;flex-direction:column}
  .mig-summary-left{flex:1;min-width:0;padding:24px 28px}
  .mig-summary-right{border-top:1px solid var(--border);padding:20px 28px}
  .mig-meta-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .mig-meta-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .mig-meta-item b{color:#3c4654;font-weight:600}
  .mig-build-row{display:flex;align-items:center;gap:12px;margin-top:4px}
  .mig-build-box{display:flex;flex-direction:column;gap:6px}
  .mig-build-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .mig-build-chip{display:inline-flex;align-items:center;gap:8px;background:#eef0f3;border-radius:9px;padding:8px 14px;font-weight:600;color:#33404f;font-size:13.5px}
  .outcome-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .outcome-label span:first-child{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .outcome-total{font-size:13px;color:var(--muted)}
  .outcome-total b{color:#1f2733;font-size:15px;font-weight:700}
  .outcome-bar{height:8px;border-radius:999px;overflow:hidden;display:flex;margin-bottom:14px;background:#eef0f3}
  .outcome-stats-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .outcome-stat{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;transition:background .15s,border-color .15s,box-shadow .15s}
  .outcome-stat:hover{background:#f4f5f7;border-color:#c9d0d8;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .outcome-stat.sel{font-weight:700}
  .outcome-stat.disabled{cursor:default;opacity:.5;background:#fff;border-style:dashed}
  .outcome-stat.disabled:hover{background:#fff;border-color:var(--border);box-shadow:none}
  .filter-lead{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
  .chip-clear{margin-left:3px;font-size:14px;line-height:1;font-weight:700;opacity:.55;display:inline-flex}
  .outcome-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .outcome-stat .ol{font-size:13px;color:#3c4654}
  .outcome-stat .ov{font-weight:700;font-size:13.5px;margin-left:4px}
  .outcome-stat .op{font-size:12px;color:var(--muted);margin-left:2px}
  .inst-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;white-space:nowrap}
  .inst-pill.success{background:#e7f6ee;color:#1f7a4d}
  .inst-pill.failed{background:#fdeceb;color:#d6453a}
  .inst-pill.terminated{background:#fdf7e6;color:#b6891f}
  .inst-table-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--border)}
  .inst-footer{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--border-2);font-size:13px;color:var(--muted)}
  .page-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#697586;cursor:pointer;font-size:16px}

/* ============================ Helpers ============================ */
/* Month names are pinned rather than taken from toLocaleDateString: en-GB abbreviates September
   to the 4-letter "Sept", which breaks the fixed `dd Mmm` width. */
const MMM = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* Timestamp for the item's title row. Relative while the item is from today, an absolute
   `dd Mmm` date once it isn't — no "ago" anywhere: the column's job is understood from its
   position, and the word repeats on every row without adding anything. Because anything before
   today's midnight resolves to a date, the relative branch never runs past 23h. */
function relTime(ts){
  const n = new Date();
  const startToday = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  if (ts < startToday){
    const d = new Date(ts);
    return `${String(d.getDate()).padStart(2,'0')} ${MMM[d.getMonth()]}`;  // 26 Jun
  }
  const s = Math.floor((Date.now()-ts)/1000);
  if (s<5)  return 'just now';
  if (s<60) return `${s}s`;
  const m = Math.floor(s/60); if (m<60) return `${m}m`;
  return `${Math.floor(m/60)}h`;
}
// Time bucket for the feed's grouping: Today · This week (prior 6 days) · Older.
function dayBucket(ts){
  const n = new Date();
  const startToday = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  if (ts >= startToday)            return 'Today';
  if (ts >= startToday - 6*_day)   return 'This week';
  return 'Older';
}
function jobLabel(j){ return `${j.source.label} → ${j.target}`; }
function jobChip(j){
  if (j.state==='PROCESSING') return ['proc','Preparing'];
  if (j.state==='FAILED') return ['fail','Failed'];
  if (j.state==='READY_WITH_EXCLUSIONS') return ['excl',`${j.exclusions.length} excluded`];
  return ['ready','Ready'];
}
function triggerDownload(job){
  const manifest = {
    export: job.source.label,
    sourceKind: job.source.kind,
    targetPlatformVersion: job.target,
    includeMediaFiles: job.includeMedia,
    generatedAt: new Date().toISOString(),
    reusedFromCache: !!job.fromCache,
    excludedResources: (job.exclusions||[]).map(e=>({ path:[...e.path, e.name].join(' \\ '), type:e.type, reason:`Not supported on ${job.target}` })),
  };
  const blob = new Blob([JSON.stringify(manifest, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `export-${job.source.label.replace(/\s+/g,'-')}-to-${job.target}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function App(){

  const [page, setPage] = useState('Processes');
  const [consoleOpen, setConsoleOpen] = useState(false);
  const [exportSource, setExportSource] = useState(null); // null | source object
  const [downloadJobId, setDownloadJobId] = useState(null);
  const [bellOpen, setBellOpen] = useState(false);
  const [bellPulse, setBellPulse] = useState(false);
  const [pulseKey, setPulseKey] = useState(0);
  const [tipBranch, setTipBranch] = useState(false);
  const [wsMenuOpen, setWsMenuOpen] = useState(false);
  const [wsType, setWsType] = useState('SANDBOX');
  const [workspace, setWorkspace] = useState('Default workspace');
  const project = 'bizkids'; // the currently open project

  const [jobs, setJobs] = useState(SEED_JOBS);
  const [toasts, setToasts] = useState([]);
  const cache = useRef({});
  // cacheKey → true once that export's simulated failure has been spent. Seeded (historical) failures
  // start already spent, so retrying one from the feed recovers on the first try; a *fresh* export of
  // the flagged build still fails once, to demo the failure → Retry → success loop end-to-end.
  const failedOnce = useRef(Object.fromEntries(
    SEED_JOBS.filter(j=>j.state==='FAILED').map(j=>[cacheKey(j.source, j.target, j.includeMedia), true])
  ));
  // Refs so the export-completion timeout reads live UI state (not stale closures).
  const bellOpenRef = useRef(false);
  const watchRef = useRef(null);    // id of the export job whose "Preparing…" modal is still open
  const migWatchRef = useRef(null); // id of the migration whose "In progress…" modal is still open
  const pulseTimer = useRef(null);
  useEffect(()=>{ bellOpenRef.current = bellOpen; }, [bellOpen]);

  // Pulse the bell once — the visual handshake when an in-progress modal is backgrounded, pointing
  // the user at where the operation now lives. Suppressed if the panel is already open (they can see it).
  // pulseKey bumps each time so the CSS animation restarts even if re-fired mid-pulse (the bell button
  // is keyed on it and remounts). No rAF — that gets throttled in a backgrounded tab.
  const pulseBell = () => {
    if (bellOpenRef.current) return;
    if (pulseTimer.current) clearTimeout(pulseTimer.current);
    setPulseKey(k=>k+1);
    setBellPulse(true);
    pulseTimer.current = setTimeout(()=>setBellPulse(false), 3400); // 3 × 1.1s + slack
  };

  /* --- Migration state --- */
  const [migrations, setMigrations] = useState(SEED_MIGRATIONS);
  const [orgNotifs, setOrgNotifs] = useState(SEED_ORG_NOTIFS);
  const [migModal, setMigModal] = useState(null);
  const [migConfig, setMigConfig] = useState(null);
  const [migDetailId, setMigDetailId] = useState(null);
  const [confirmNav, setConfirmNav] = useState(null); // pending navigation awaiting a discard/keep decision
  // migModal: null | {step:'setup'} | {step:'summary',src,tgt} | {step:'processing',id,src,tgt}

  const downloadJob = jobs.find(j=>j.id===downloadJobId) || null;
  // Terminal + unread only — failures included (they need a Retry), in-progress excluded (§5.11).
  const unread = [
    ...jobs.filter(j=>(jobReady(j) || j.state==='FAILED') && !j.read && !j.dismissed),
    ...migrations.filter(m=>(m.state==='COMPLETED' || m.state==='FAILED') && !m.read && !m.dismissed),
    ...orgNotifs.filter(o=>!o.read && !o.dismissed),
  ].length;

  const dismissToast = (id)=> setToasts(p=>p.filter(x=>x.id!==id));
  // Every toast goes through here. Appending puts the newest LAST, which — in a bottom-anchored
  // column — is the slot nearest the corner. slice(-TOAST_MAX) then evicts the OLDEST, so a burst
  // can never hide the most recent result and the stack can never grow into a curtain (§5.5.1).
  const enqueueToast = (t) => setToasts(p => [...p, t].slice(-TOAST_MAX));
  // A toast's action mirrors its feed row: Retry on a failure, otherwise the normal act-on.
  const actOnToast = (t) => {
    if (t.retry) return t.type==='migration' ? retryMigration(t.migId) : retryJob(t.jobId);
    if (t.type==='migration') actOnMigration(t.migId); else actOnJob(t.jobId);
  };
  const pushToast = (job) => {
    const failed = job.state === 'FAILED';
    const excl = (job.exclusions||[]).length;
    const id = uid();
    // Same structure / labels / colours as the feed item — a toast is just a shorter view of it.
    const subj = job.source && job.source.kind==='build' ? 'Build export' : 'Version export';
    const toast = failed ? {
      id, jobId: job.id, type:'export', ctx: job.ctx,
      cls:'err', icon:'errCircle',
      title: `${subj} failed`,
      subtitle: jobLabel(job),           // cause lives in the item; the toast stays one line
      action:'Retry', retry:true, download:false,
    } : {
      id, jobId: job.id, type:'export', excluded: excl>0, ctx: job.ctx,
      cls: excl ? 'warn' : 'ok',
      icon: excl ? 'warn' : 'check',
      title: excl ? `${subj} ready — ${excl} resource${excl>1?'s':''} excluded` : `${subj} ready to download`,
      subtitle: jobLabel(job) + (job.fromCache ? ' · reused' : ''),
      action: excl ? 'Review' : 'Download',
      download: !excl,
    };
    enqueueToast(toast);
    // Auto-dismiss is owned by each <Toast> (5s no-action / 7s with-action, paused on hover/focus/tab-blur).
  };
  // Migration completion toast — same shape as a feed item. Reused by completion-while-not-watching
  // and by backgrounding a migration that already finished (§5.11).
  const pushMigrationToast = (m) => {
    const total = m.summary.migrateTo.length;
    enqueueToast({
      id:uid(), migId:m.id, type:'migration', ctx:m.ctx,
      cls:'ok', icon:'check',
      title:'Instances migrated',
      subtitle:`${m.srcBuild} → ${m.tgtBuild} · ${total} process${total>1?'es':''}`,
      action:'View', download:false,
    });
  };

  const markRead = (id) => setJobs(p=>p.map(j=>j.id===id?{...j, read:true}:j));
  // Mark a single notification read from any of the three collections (the on-hover ✓ action).
  const markOneRead = (id) => {
    setJobs(p=>p.map(j=>j.id===id?{...j, read:true}:j));
    setMigrations(p=>p.map(m=>m.id===id?{...m, read:true}:m));
    setOrgNotifs(p=>p.map(o=>o.id===id?{...o, read:true}:o));
  };
  const markAllRead = () => {
    setJobs(p=>p.map(j=>({...j, read:true})));
    setMigrations(p=>p.map(m=>({...m, read:true})));
    setOrgNotifs(p=>p.map(o=>({...o, read:true})));
  };
  const dismissNote = (id) => {
    setJobs(p=>p.map(j=>j.id===id?{...j, dismissed:true, read:true}:j));
    setMigrations(p=>p.map(m=>m.id===id?{...m, dismissed:true, read:true}:m));
    setOrgNotifs(p=>p.map(o=>o.id===id?{...o, dismissed:true, read:true}:o));
  };
  // Org-level action (View users / Manage plan): acknowledge + close the panel (destination is out of prototype scope).
  const actOrg = (id) => { markOneRead(id); setBellOpen(false); };

  // Tear down every open overlay/flow (used once a navigation is actually committed).
  const closeAllOverlays = () => {
    setBellOpen(false);
    setExportSource(null); watchRef.current = null;
    setDownloadJobId(null);
    setMigModal(null); migWatchRef.current = null;
    setMigConfig(null);
    setConsoleOpen(false);
  };

  // Flows holding unsaved user input that a navigation would throw away. (A running migration's
  // "processing" modal is NOT dirty — it keeps going in the background, so leaving loses nothing.)
  const dirtyLabel =
    migConfig                                   ? 'a migration setup' :
    (migModal && migModal.step!=='processing')  ? 'a migration setup' :
    exportSource                                ? 'an export setup'  : null;

  // A notification action can fire while a modal is open (a toast sits above the scrim) or from a
  // config page (the bell is reachable there). If unsaved setup would be lost, ask first —
  // Keep working vs Discard & leave — instead of silently discarding it.
  const requestNav = (proceed) => {
    if (dirtyLabel){ setBellOpen(false); setConfirmNav(()=>proceed); }
    else proceed();
  };

  // Act on a ready export: clean → download the ZIP instantly; with exclusions → open the impact modal.
  const actOnJob = (jobId) => {
    const job = jobs.find(j=>j.id===jobId);
    if (!jobReady(job)) return;
    if (job.state==='READY_WITH_EXCLUSIONS'){
      requestNav(()=>{             // opening the review modal tears down other overlays — guard it
        markRead(jobId);
        closeAllOverlays();
        setConfirmNav(null);
        setDownloadJobId(jobId);
      });
    } else {
      markRead(jobId);
      setBellOpen(false);          // pure download — no navigation, leave the current context intact
      triggerDownload(job);
    }
  };

  // Retry a FAILED export: re-run straight away with the original params. Safe to do on one click
  // because an export is read-only and reversible — it produces an artifact, it changes nothing.
  // (A migration retry deliberately does NOT do this — see retryMigration.)
  // The failed notification is marked read (acted on — ACTED_ON in the §2 lifecycle) and the fresh
  // run raises its own notification, so the feed shows one attempt per row rather than mutating
  // history in place.
  const retryJob = (jobId) => {
    const job = jobs.find(j=>j.id===jobId);
    if (!job || job.state!=='FAILED') return;
    markRead(jobId);
    setBellOpen(false);          // re-runs in the background — no navigation, no modal
    startExport(job.source, job.target, job.includeMedia);
  };
  // Retry a FAILED migration — same contract, minus the modal (it re-runs in the background).
  // Retrying a MIGRATION does NOT re-run it — it reopens the operation's last confirmation gate,
  // the Bulk Migration Summary, with Start Migration as the deliberate commit. A migration is
  // irreversible ("cannot be stopped or canceled"), so a single click in the notification panel must
  // never launch one: the retry path gets the same gate as the original, not a shortcut around it.
  // It also lets the user re-read what will happen — the builds/instances may have moved on since
  // the failure — and Back still leads to the mapping config.
  const retryMigration = (migId) => {
    const m = migrations.find(x=>x.id===migId);
    if (!m || m.state!=='FAILED') return;
    requestNav(()=>{             // opening the gate tears down other overlays — guard unsaved setup
      markOneRead(migId);
      closeAllOverlays();
      setConfirmNav(null);
      setMigModal({ step:'summary', src:m.srcBuild, tgt:m.tgtBuild });
    });
  };

  const closeExport = () => { watchRef.current = null; setExportSource(null); };
  // The "Preparing…" modal for this job is still open → switch it straight to the download modal.
  const onExportReady = (job) => {
    watchRef.current = null;
    markRead(job.id);
    setExportSource(null);
    setDownloadJobId(job.id);
  };

  const startExport = (source, target, includeMedia) => {
    const ctx = { wsType, workspace, project }; // snapshot of where the export was launched
    const key = cacheKey(source, target, includeMedia);
    const cached = cache.current[key];
    if (cached){
      // User clicked "Get download" on a cache hit: they're looking right at it and the result comes
      // back immediately (download fires / review modal opens), so NO toast — that would double-surface
      // a result they already have (§5.5). It lands in the feed already read, since they just acted on it.
      const job = { id:uid(), source, target, includeMedia, ctx, state:cached.state, exclusions:cached.exclusions, fromCache:true, read:true, ts:Date.now() };
      setJobs(p=>[job, ...p]);
      closeExport();
      if (job.state==='READY_WITH_EXCLUSIONS') setDownloadJobId(job.id);
      else triggerDownload(job);                          // instant + user-initiated
      return job;
    }
    const job = { id:uid(), source, target, includeMedia, ctx, state:'PROCESSING', exclusions:null, fromCache:false, read:false, ts:Date.now() };
    setJobs(p=>[job, ...p]);
    // Prototype: the flagged build fails its first attempt, then succeeds — so Retry visibly recovers.
    const willFail = source.tag === FAIL_ONCE_TAG && !failedOnce.current[key];
    setTimeout(()=>{
      const watched = watchRef.current === job.id;
      if (willFail){
        failedOnce.current[key] = true;                    // the retry of this same export will pass
        const failed = { ...job, state:'FAILED', exclusions:[], failReason:FAIL_COPY.export };
        setJobs(p=>p.map(j=>j.id===job.id? failed : j));
        // A failure is a result like any other: surface it unless they're already looking at it.
        // If watched, ExportModal switches its Preparing screen to the failure state instead.
        if (!watched && !bellOpenRef.current) pushToast(failed);
        return;
      }
      const excl = EXCLUSIONS[target] || [];
      const finished = { ...job, state: excl.length ? 'READY_WITH_EXCLUSIONS' : 'READY', exclusions: excl };
      cache.current[key] = { state:finished.state, exclusions:excl };
      setJobs(p=>p.map(j=>j.id===job.id? finished : j));
      // Suppress the right-side toast when the user is already looking:
      //   (a) the notification center is open, or (b) the Preparing modal for this job is open.
      if (!watched && !bellOpenRef.current) pushToast(finished);
      // If watched, ExportModal's effect calls onExportReady → switches to the download modal.
    }, PROCESS_MS);
    return job;
  };

  /* --- Migration handlers --- */
  const startMigration = (src, tgt) => {
    const ctx = { wsType, workspace, project };
    const summary = genMigSummary();
    const id = uid();
    const mig = { id, type:'migration', opType:'Migration Bulk', opId:hexId(), srcBuild:src, tgtBuild:tgt,
                  state:'IN_PROGRESS', summary, ctx, read:false, dismissed:false, ts:Date.now() };
    setMigrations(p=>[mig, ...p]);
    migWatchRef.current = id; // caller opens the processing modal; we track it here
    setTimeout(()=>{
      const finished = { ...mig, state:'COMPLETED' };
      setMigrations(p=>p.map(m=>m.id===id ? finished : m));
      // Suppress toast when the processing modal is still open (it switches to detail directly)
      // or when the bell panel is already showing the result.
      const watched = migWatchRef.current === id;
      if (!watched && !bellOpenRef.current) pushMigrationToast(finished);
    }, MIGRATION_PROCESS_MS);
    return id;
  };

  const actOnMigration = (migId) => {
    requestNav(()=>{               // guard against discarding an open setup before navigating
      setMigrations(p=>p.map(m=>m.id===migId?{...m, read:true}:m));
      closeAllOverlays();
      setConfirmNav(null);
      setMigDetailId(migId);
      setView('runtime');
      setPage('Corrective Actions');
    });
  };

  const switchView = (v) => { setView(v); setPage(v==='runtime'?'Builds':'Processes'); setConsoleOpen(false); };
  const openExportBuild = (b) => setExportSource({ kind:'build', id:'build@'+b.tag, label:'Bizkids '+b.tag, tag:b.tag });
  const selectWorkspace = (e, ws) => { setWsType(e); setWorkspace(ws); setWsMenuOpen(false); };
  const hasRunning = jobs.some(j=>j.state==='PROCESSING') || migrations.some(m=>m.state==='IN_PROGRESS');

  return (
    <div className="app" onClick={()=>{ if(bellOpen)setBellOpen(false); if(wsMenuOpen)setWsMenuOpen(false); }}>
      <Header
        view={view} onSwitchView={switchView}
        unread={unread} pulse={bellPulse} pulseKey={pulseKey}
        onBranch={()=>setConsoleOpen(true)}
        onBell={(e)=>{e.stopPropagation();setBellOpen(o=>!o);setWsMenuOpen(false);}}
        tip={tipBranch} setTip={setTipBranch}
        wsType={wsType} workspace={workspace} project={project}
        wsMenuOpen={wsMenuOpen}
        onLogo={(e)=>{e.stopPropagation();setWsMenuOpen(o=>!o);setBellOpen(false);}}
        onSelectWs={selectWorkspace}
      />
      {bellOpen &&
        <BellPanel
          jobs={jobs} migrations={migrations} orgNotifs={orgNotifs}
          onClose={()=>setBellOpen(false)} onMarkAll={markAllRead}
          onAct={actOnJob} onActMig={actOnMigration} onActOrg={actOrg}
          onRetry={retryJob} onRetryMig={retryMigration}
          onMarkRead={markOneRead} onDismiss={dismissNote}
          stop={(e)=>e.stopPropagation()}
        />}

      <div className="body">
        <Sidebar nav={view==='runtime'?RUNTIME_NAV:NAV} page={page} setPage={setPage} />
        <div className="content">
          {migConfig
            ? <MigrationConfigPage
                src={migConfig.src} tgt={migConfig.tgt}
                onBack={()=>{ setMigConfig(null); }}
                onCancel={()=>setMigConfig(null)}
                onContinue={()=>{ const c=migConfig; setMigConfig(null); setMigModal({step:'summary', src:c.src, tgt:c.tgt}); }}
              />
            : migDetailId
            ? (() => {
                const m = migrations.find(x=>x.id===migDetailId);
                return m
                  ? <MigrationDetailPage mig={m} onBack={()=>setMigDetailId(null)} />
                  : null;
              })()
            : view==='config'
            ? (page==='Processes'
                ? <ProcessesPage onOpenConsole={()=>setConsoleOpen(true)} />
                : <GenericPage title={page} hasRunning={hasRunning} />)
            : (page==='Builds'
                ? <BuildsPage onExportBuild={openExportBuild} jobs={jobs} onAct={actOnJob} />
                : page==='Corrective Actions'
                ? <CorrectiveActionsPage
                    migrations={migrations}
                    onNewMigration={()=>setMigModal({step:'setup'})}
                    onViewDetail={(id)=>setMigDetailId(id)}
                  />
                : <GenericPage title={page} hasRunning={hasRunning} />)}
        </div>
      </div>

      {consoleOpen &&
        <BranchingConsole
          onClose={()=>setConsoleOpen(false)}
          onExport={()=>setExportSource(VERSION_SOURCE)}
        />}

      {exportSource && !confirmNav &&
        <ExportModal
          source={exportSource}
          onClose={closeExport}
          onBackground={()=>{
            const j = jobs.find(x=>x.id===watchRef.current); // the export whose Preparing modal is open
            closeExport();
            // Backgrounding it: if it already settled in the min-display sliver (ready OR failed), the
            // user has stopped looking → surface it as a toast; otherwise pulse at the still-running op.
            if (j && (jobReady(j) || j.state==='FAILED')){ if (!bellOpenRef.current) pushToast(j); }
            else pulseBell();
          }}
          onStart={startExport}
          onWatch={(id)=>{ watchRef.current = id; }}
          onReady={onExportReady}
          jobs={jobs}
          cache={cache}
        />}

      {downloadJob &&
        <DownloadModal
          job={downloadJob}
          onClose={()=>setDownloadJobId(null)}
          onChangeTarget={()=>{ const j=downloadJob; setDownloadJobId(null); setExportSource(j.source); }}
        />}

      {migModal?.step==='setup' && !confirmNav &&
        <MigrationSetupModal
          onClose={()=>setMigModal(null)}
          onContinue={(src,tgt)=>{ setMigModal(null); setMigConfig({src, tgt}); }}
        />}
      {migModal?.step==='summary' && !confirmNav &&
        <MigrationSummaryModal
          src={migModal.src} tgt={migModal.tgt}
          onBack={()=>{ const m=migModal; setMigModal(null); setMigConfig({src:m.src, tgt:m.tgt}); }}
          onStart={()=>{
            const id = startMigration(migModal.src, migModal.tgt);
            setMigModal({step:'processing', id, src:migModal.src, tgt:migModal.tgt});
          }}
          onClose={()=>setMigModal(null)}
        />}
      {migModal?.step==='processing' &&
        <MigrationProcessingModal
          migId={migModal.id} src={migModal.src} tgt={migModal.tgt}
          migrations={migrations}
          onClose={()=>{
            const m = migrations.find(x=>x.id===migWatchRef.current);
            migWatchRef.current=null; setMigModal(null);
            // Same rule as export: finished in the min-display sliver → toast; still running → pulse.
            if (m && m.state==='COMPLETED'){ if (!bellOpenRef.current) pushMigrationToast(m); }
            else pulseBell();
          }}
          onComplete={(id)=>{ migWatchRef.current=null; setMigModal(null); markOneRead(id); setMigDetailId(id); setPage('Corrective Actions'); setView('runtime'); }}
        />}

      {confirmNav &&
        <ConfirmLeaveModal
          label={dirtyLabel || 'a setup'}
          onKeep={()=>setConfirmNav(null)}
          onDiscard={()=>confirmNav()}
        />}

      <Toasts toasts={toasts} onAct={actOnToast} onClose={dismissToast} />
      <div className="proto-stamp">Prototype · mocked backend</div>
    </div>
  );
}

/* ============================ Export modal ============================ */
function ExportModal({ source, onClose, onBackground, onStart, onWatch, onReady, jobs, cache }){
  const [target, setTarget] = useState('5.9.X');
  const [media, setMedia] = useState(true);
  const [open, setOpen] = useState(false);
  const [phase, setPhase] = useState('form'); // form | processing
  const [pct, setPct] = useState(0);
  const [watchId, setWatchId] = useState(null);
  const procShownAt = useRef(0); // when the processing screen appeared (for the min-display guard)

  const isBuild = source.kind === 'build';
  const isLower = target !== '5.9.X';
  const willHitCache = !!cache.current[cacheKey(source, target, media)];

  useEffect(()=>{
    if (phase!=='processing') return;
    procShownAt.current = Date.now();
    setPct(4);
    const t = setInterval(()=> setPct(p=> Math.min(p + (100/(PROCESS_MS/250)), 96)), 250);
    return ()=>clearInterval(t);
  }, [phase]);

  // While the Preparing modal is open, when this export settles → switch straight to the outcome:
  // ready → the download modal; failed → this modal's own failure state (never spin on forever).
  // Held to a MIN_MODAL_MS floor so a fast/cache-warmed result doesn't flash the loading screen.
  useEffect(()=>{
    if (phase!=='processing' || !watchId) return;
    const j = jobs.find(x=>x.id===watchId);
    if (!j || (!jobReady(j) && j.state!=='FAILED')) return;
    const wait = Math.max(0, MIN_MODAL_MS - (Date.now()-procShownAt.current));
    const t = setTimeout(()=> j.state==='FAILED' ? setPhase('failed') : onReady(j), wait);
    return ()=>clearTimeout(t);
  }, [jobs, watchId, phase]);

  // In the processing phase, any close means "background it" (pulse the bell); in the form it's a plain cancel.
  // On the failure screen it's a plain close — the failed item is already waiting in the feed.
  const handleClose = () => { if (phase==='processing') (onBackground||onClose)(); else onClose(); };

  // Retry from the failure screen: re-run the same params and go back to watching.
  const onRetryHere = () => {
    const job = onStart(source, target, media);
    if (job){ setWatchId(job.id); onWatch(job.id); }
    setPhase('processing');
  };

  const onExport = () => {
    if (willHitCache){ onStart(source, target, media); return; } // instant -> modal closes, download opens
    const job = onStart(source, target, media);
    if (job){ setWatchId(job.id); onWatch(job.id); }
    setPhase('processing');
  };

  return (
    <div className="modal-scrim" onClick={handleClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        {phase==='form' ? (
          <>
            <div className="mhead">
              <button className="mclose" onClick={handleClose}>{I.x}</button>
              <h2>{isBuild ? 'Export build' : 'Export Version'}</h2>
              <div style={{display:'flex',gap:7,alignItems:'center'}}>
                {isBuild
                  ? <span className="build-chip" style={{padding:'5px 12px',fontSize:13}}>{I.hammer} {source.label}</span>
                  : <>
