<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowX — Export / Download / Notifications prototype</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // Force the classic JSX runtime (React.createElement) so the inline script
  // runs as a classic script — the automatic runtime emits `import`, which fails.
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets.react, { runtime: 'classic' }]]
  });
</script>
<style>
  :root{
    --bg:#f4f5f7; --panel:#fff; --header:#0e1422; --header-line:#222c3e;
    --text:#1f2733; --muted:#697586; --faint:#9aa4b2; --border:#e6e8ec; --border-2:#eef0f3;
    --blue:#1f6feb; --blue-700:#1a5fd0; --blue-soft:#eaf1fe;
    --amber-bg:#fdf7e6; --amber-bd:#f0e0ad; --amber-bar:#e9b949; --amber-text:#8a6a16;
    --green:#2e9e6b; --yellow:#e7b008; --red:#e0584d;
    --shadow:0 6px 22px rgba(16,24,40,.13);
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%}
  body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;flex-direction:column;height:100%}

  /* ---------- Header ---------- */
  .header{height:54px;background:var(--header);display:flex;align-items:center;gap:14px;padding:0 16px;color:#dbe2ea;flex:0 0 auto;position:relative;z-index:60}
  .logo{width:30px;height:30px;border-radius:7px;background:#11161f;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;border:0;border-bottom:2px solid var(--amber-bar);padding:0;font-size:14px;cursor:pointer}
  .logo:hover{background:#1a2233}
  .crumb-proj{display:inline-flex;align-items:center;gap:5px}
  .crumb-proj svg{color:#8c98a8}
  .env-badge{font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:6px;white-space:nowrap}
  .env-badge.sandbox{background:#1f6feb;color:#fff}
  .env-badge.staging{background:#f0b429;color:#503c05}
  .env-badge.production{background:#3a4250;color:#fff}
  .env-badge.sm{font-size:9.5px;padding:1px 7px;border-radius:5px}
  /* workspace switcher */
  .ws-menu{position:absolute;top:42px;left:0;width:306px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:80;padding:14px 14px 10px}
  .ws-brand{text-align:center;font-weight:800;font-size:18px;color:#11161f;letter-spacing:-.01em;margin:2px 0 12px}
  .ws-brand span{border-bottom:3px solid var(--amber-bar);padding-bottom:1px}
  .ws-search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--faint);margin-bottom:8px}
  .ws-search input{border:0;outline:0;flex:1;font-size:13px;color:var(--text)}
  .ws-group{padding:2px 0}
  .ws-grouphead{display:flex;align-items:center;gap:8px;padding:8px 6px;cursor:pointer;border-radius:8px}
  .ws-grouphead:hover{background:#f5f7fa}
  .chev2{display:flex;color:#8c98a8;transition:transform .15s;transform:rotate(-90deg)}
  .chev2.open{transform:none}
  .ws-item{padding:8px 10px 8px 34px;font-size:13.5px;color:#3c4654;cursor:pointer;border-radius:8px}
  .ws-item:hover{background:#f5f7fa}
  .ws-item.sel{background:var(--blue-soft);color:var(--blue);font-weight:600}
  .crumb{color:#aeb8c6;font-size:13px}
  .crumb b{color:#eef2f6;font-weight:600}
  .branch-pill{display:flex;align-items:center;gap:8px;background:#161d2b;border:1px solid #2a3447;border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;transition:border-color .15s}
  .branch-pill:hover{border-color:#41506b}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
  .tok{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;line-height:1.4}
  .tok.main{background:#13233f;color:#7db0ff;border:1px solid #28456f}
  .tok.committed{background:#11301f;color:#5fcf8e;border:1px solid #1f5236}
  .tok.draft{color:#e8a14a;border:1px dashed #7a5a23;background:transparent}
  .tok.msg{color:#9aa4b2}
  .commit-btn{display:flex;align-items:center;gap:7px;background:#161d2b;border:1px solid #2a3447;color:#cfd8e3;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500}
  .commit-btn:hover{background:#1b2433}
  .spacer{flex:1}
  .seg{display:flex;background:#161d2b;border:1px solid #2a3447;border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;color:#8c98a8;padding:5px 12px;font-size:12.5px;font-weight:600}
  .seg button.on{background:var(--blue);color:#fff}
  .icon-btn{position:relative;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;color:#aeb8c6;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:#161d2b;color:#fff}
  .bell-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:#e0584d;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--header)}
  .tooltip{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:#fff;color:#333;font-size:11px;padding:3px 8px;border-radius:6px;box-shadow:var(--shadow);white-space:nowrap;pointer-events:none}
  .avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#3a2e00}
  .avatar.af{background:#f6c344}.avatar.mg{background:#cdd4dd;color:#3a4250}.avatar.ck{background:#bcd3c4;color:#234}

  /* ---------- Body ---------- */
  .body{flex:1;display:flex;min-height:0}
  .sidebar{width:248px;background:#fff;border-right:1px solid var(--border);padding:10px 0;overflow:auto;flex:0 0 auto}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 18px;color:#3c4654;font-size:13.5px;cursor:pointer;font-weight:500}
  .nav-item:hover{background:#f7f8fa}
  .nav-item.on{background:var(--blue-soft);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
  .nav-item .ic{color:#8c98a8;display:flex}
  .nav-item.on .ic{color:var(--blue)}
  .nav-sub{padding:7px 18px 7px 47px;color:#5b6573;font-size:13px;cursor:pointer}
  .nav-sub:hover{background:#f7f8fa}
  .nav-sub.on{background:var(--blue-soft);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
  .nav-section{display:flex;align-items:center;gap:11px;padding:13px 18px 5px;color:#1f2733;font-size:13.5px;font-weight:700}
  .nav-section .ic{color:#5b6573;display:flex}
  .nav-group-label{font-size:11px;font-weight:700;letter-spacing:.05em;color:#9aa4b2;padding:14px 18px 4px;text-transform:uppercase}
  .content{flex:1;overflow:auto;padding:22px 26px}

  .card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm)}
  .page-head{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:16px}
  .page-head h1{margin:0;font-size:22px;font-weight:700}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:8px 12px;width:330px;color:var(--faint)}
  .search input{border:0;outline:0;flex:1;font-size:13.5px;color:var(--text)}
  .btn-blue{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .btn-blue:hover{background:var(--blue-700)}
  .btn-blue:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:#fff;color:#3c4654;border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-weight:600;display:flex;align-items:center;gap:7px;justify-content:center}
  .btn-ghost:hover{background:#f7f8fa}
  .kbd-hint{display:flex;align-items:center;gap:9px;background:#eef4ff;border:1px solid #d7e3ff;color:#2a5fb0;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:14px 18px;border-bottom:1px solid var(--border)}
  tbody td{padding:15px 18px;border-bottom:1px solid var(--border-2);font-size:14px}
  tbody tr:last-child td{border-bottom:0}
  .row-name{font-weight:500;color:#222b38}
  .who{display:flex;align-items:center;gap:9px;color:#3c4654}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .mini{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#697586;display:flex;align-items:center;justify-content:center}
  .mini:hover{background:#f5f6f8}

  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;color:var(--muted);text-align:center;gap:8px}
  .placeholder .big{font-size:18px;font-weight:600;color:#3c4654}

  /* ---------- Builds (runtime) ---------- */
  .builds-label{font-size:12px;font-weight:600;color:var(--muted);padding:16px 18px 8px}
  .build-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin:0 8px;border-radius:10px}
  .build-row:hover{background:#f7f8fa}
  .build-chip{display:inline-flex;align-items:center;gap:9px;background:#eef0f3;border-radius:9px;padding:9px 15px;font-weight:600;color:#33404f;font-size:14px}
  .build-chip svg{color:#7e8a9a}
  .ready-pill{display:inline-flex;align-items:center;gap:6px;background:#e7f6ee;color:#1f7a4d;border:1px solid #bce6cf;border-radius:8px;padding:6px 11px;font-weight:600;font-size:12px;white-space:nowrap}
  .ready-pill:hover{background:#dcf1e6}
  .tipwrap{position:relative;display:inline-flex}
  .tipwrap .tip{position:absolute;bottom:-32px;right:0;background:#1f2733;color:#fff;font-size:11px;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
  .tipwrap:hover .tip{opacity:1}

  /* ---------- Branching console overlay ---------- */
  .overlay{position:absolute;inset:54px 0 0 0;background:rgba(15,20,34,.28);z-index:40;display:flex}
  .console{position:absolute;inset:54px 0 0 0;background:#fff;z-index:41;display:grid;grid-template-columns:300px 1fr 360px;overflow:hidden}
  .vpanel{border-right:1px solid var(--border);padding:18px;overflow:auto;display:flex;flex-direction:column}
  .vpanel h3,.cpanel h3{margin:0 0 14px;font-size:15px;font-weight:700}
  .tagrow{display:flex;gap:7px;margin-bottom:10px}
  .vtag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px}
  .vtag.main{background:#eaf1fe;color:#1f6feb}
  .vtag.committed{background:#e7f6ee;color:#2e9e6b}
  .vtag.draft{color:#c9842a;border:1px dashed #e0b878;background:#fdf7e6}
  .meta{font-size:12.5px;color:var(--muted);margin:4px 0}
  .meta b{color:#3c4654;font-weight:600}
  .rc-title{font-size:13px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:6px}
  .rc{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;color:#546070}
  .rc-bar{width:4px;height:18px;border-radius:3px;flex:0 0 auto}
  .rc .nm{color:#222b38;font-weight:600}
  .vpanel .actions{margin-top:auto;display:flex;flex-direction:column;gap:9px;padding-top:18px}
  .center{padding:18px 22px;overflow:auto;background:#fcfcfd}
  .center .ttl{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .branch-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:8px}
  .branch-row.sel{outline:2px solid var(--blue);background:#f3f8ff}
  .branch-row:hover{background:#f5f7fa}
  .node{width:13px;height:13px;border-radius:50%;background:var(--blue);flex:0 0 auto;margin-left:6px}
  .node.draft{background:#fff;border:2px dashed #e0a64a}
  .node.orange{background:#e9a23b}
  .vline{flex:1}
  .vername{display:flex;align-items:center;gap:8px}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px}
  .pill.main{background:#eaf1fe;color:#1f6feb}
  .pill.ver{background:#eef0f3;color:#546070;display:flex;align-items:center;gap:4px}
  .pill.test{background:#fcf3d6;color:#9a7a16}
  .pill.hotfix{background:#fcf3d6;color:#9a7a16}
  .pill.draftp{color:#c9842a;border:1px dashed #e0b878}
  .cpanel{border-left:1px solid var(--border);padding:18px;overflow:auto}
  .cpanel .crow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border-2);font-size:13px}
  .crow .msg{color:#3c4654;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- Modal ---------- */
  .modal-scrim{position:fixed;inset:0;background:rgba(15,20,34,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:540px;max-width:100%;max-height:90vh;overflow:auto}
  .modal .mhead{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 26px 6px;position:relative}
  .modal .mhead h2{margin:0;font-size:21px;font-weight:700}
  .mclose{position:absolute;top:18px;right:18px;border:0;background:transparent;color:#9aa4b2;width:30px;height:30px;border-radius:8px}
  .mclose:hover{background:#f2f3f5;color:#555}
  .mbody{padding:8px 26px 22px}
  .dl-ctx{display:flex;align-items:center;gap:8px;margin-top:8px}
  .dl-ctx-t{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
  .dl-ctx-t svg{color:#9aa4b2;vertical-align:-2px}
  .infobox{display:flex;gap:10px;background:#f7f8fa;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:#546070;font-size:12.7px;line-height:1.5;margin:10px 0 20px}
  .infobox.amber{background:var(--amber-bg);border-color:var(--amber-bd);color:#7a5f18}
  .field-label{font-size:13.5px;font-weight:600;margin-bottom:7px}
  .select{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;cursor:pointer;background:#fff}
  .select:hover{border-color:#c7cdd6}
  .select .cur{font-size:11px;font-weight:600;color:#697586;background:#eef0f3;border-radius:6px;padding:2px 8px;margin-right:8px}
  .help{font-size:12px;color:var(--muted);margin:7px 0 0}
  .dd{border:1px solid var(--border);border-radius:10px;margin-top:6px;box-shadow:var(--shadow-sm);overflow:hidden}
  .dd-item{padding:11px 14px;font-size:14px;display:flex;align-items:center;justify-content:space-between;position:relative}
  .dd-item:hover{background:#f5f7fa;cursor:pointer}
  .dd-item.sel{background:#eaf1fe;color:var(--blue)}
  .dd-item.disabled{cursor:not-allowed;opacity:1}
  .dd-item.disabled:hover{background:transparent}
  .dd-item.disabled .build-ver{color:#b0b8c4}
  .dd-item.disabled .build-ver svg{color:#c8d0da}
  .dd-item-no-inst{font-size:11px;color:#b0b8c4;font-style:italic;margin-left:8px;white-space:nowrap}
  .dd-item[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#1f2733;color:#fff;padding:5px 10px;border-radius:6px;font-size:11.5px;white-space:nowrap;z-index:200;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .info-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.5px solid #6b7280;font-size:10px;color:#6b7280;cursor:default;font-style:normal;font-weight:600;margin-left:4px;vertical-align:middle;position:relative}
  .info-icon[data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);background:#1f2733;color:#fff;padding:5px 10px;border-radius:6px;font-size:11.5px;white-space:nowrap;z-index:200;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .toggle-row{display:flex;align-items:center;gap:11px;margin-top:22px}
  .switch{width:38px;height:22px;border-radius:999px;background:#cdd4dd;position:relative;transition:background .15s;border:0;flex:0 0 auto}
  .switch.on{background:var(--blue)}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.on .knob{left:18px}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}

  /* processing */
  .proc{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 10px 6px}
  .spinner{width:42px;height:42px;border-radius:50%;border:4px solid #e6ebf2;border-top-color:var(--blue);animation:spin 1s linear infinite;margin-bottom:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .proc h3{margin:0 0 6px;font-size:17px}
  .proc p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;max-width:360px}
  .progress{width:100%;height:6px;background:#eef0f3;border-radius:999px;overflow:hidden;margin:20px 0 6px}
  .progress .bar{height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
  .sim-note{font-size:11.5px;color:var(--faint);margin-top:4px}

  /* excluded panel */
  .excl-head{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px;margin:18px 0 4px}
  .excl-head .cnt{color:var(--muted);font-weight:600}
  .excl-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--border-2);font-size:14px}
  .excl-row:last-child{border-bottom:0}
  .excl-bar{width:4px;height:20px;border-radius:3px;background:#cfd5de;flex:0 0 auto}
  .excl-path{color:var(--muted)}
  .excl-path b{color:#1f2733;font-weight:700}
  .ok-banner{display:flex;gap:10px;align-items:center;background:#e9f7ef;border:1px solid #bce6cf;color:#1f7a4d;border-radius:10px;padding:13px 15px;font-size:13.5px}

  /* ---------- Bell panel ---------- */
  .bell-panel{position:absolute;top:50px;right:10px;width:392px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);z-index:70;overflow:hidden}
  .bp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
  .bp-head h4{margin:0;font-size:14.5px}
  .bp-head button{border:0;background:transparent;color:var(--blue);font-size:12.5px;font-weight:600}
  .bp-section{font-size:11px;font-weight:700;letter-spacing:.05em;color:#9aa4b2;text-transform:uppercase;padding:12px 16px 6px}
  .bp-filters{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:#546070}
  .fchip:hover{background:#f5f7fa}
  .fchip.on{background:var(--blue-soft);border-color:#cfe0ff;color:var(--blue)}
  .fcount{font-size:11px;font-weight:700;color:var(--faint)}
  .fchip.on .fcount{color:var(--blue)}
  .nlist{max-height:420px;overflow:auto}
  .nitem{padding:11px 14px;border-bottom:1px solid var(--border-2)}
  .nitem:hover{background:#fafbfc}
  .nitem.unread{background:#f3f8ff;box-shadow:inset 3px 0 0 var(--blue)}
  .nrow1{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .nmeta{font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nproj{display:inline-flex;align-items:center;gap:4px;vertical-align:bottom}
  .nproj svg{color:#9aa4b2;vertical-align:-2px}
  .ntime{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
  .ndismiss{border:0;background:transparent;color:#c2cad4;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0}
  .ndismiss:hover{background:#eef0f3;color:#697586}
  .ndismiss svg{width:14px;height:14px}

/* ============================ Helpers ============================ */
function relTime(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if (s<5) return 'just now';
  if (s<60) return `${s}s ago`;
  const m = Math.floor(s/60); if (m<60) return `${m}m ago`;
  return `${Math.floor(m/60)}h ago`;
}
function jobLabel(j){ return `${j.source.label} → ${j.target}`; }
function jobChip(j){
  if (j.state==='PROCESSING') return ['proc','Preparing'];
  if (j.state==='FAILED') return ['fail','Failed'];
  if (j.state==='READY_WITH_EXCLUSIONS') return ['excl',`${j.exclusions.length} excluded`];
  return ['ready','Ready'];
}
function triggerDownload(job){
  const manifest = {
    export: job.source.label,
    sourceKind: job.source.kind,
    targetPlatformVersion: job.target,
    includeMediaFiles: job.includeMedia,
    generatedAt: new Date().toISOString(),
    reusedFromCache: !!job.fromCache,
    excludedResources: (job.exclusions||[]).map(e=>({ path:[...e.path, e.name].join(' \\ '), type:e.type, reason:`Not supported on ${job.target}` })),
  };
  const blob = new Blob([JSON.stringify(manifest, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `export-${job.source.label.replace(/\s+/g,'-')}-to-${job.target}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ============================ App ============================ */
function App(){
  const [view, setView] = useState('config'); // 'config' | 'runtime'
  const [page, setPage] = useState('Processes');
  const [consoleOpen, setConsoleOpen] = useState(false);
  const [exportSource, setExportSource] = useState(null); // null | source object
  const [downloadJobId, setDownloadJobId] = useState(null);
  const [bellOpen, setBellOpen] = useState(false);
  const [tipBranch, setTipBranch] = useState(false);
  const [wsMenuOpen, setWsMenuOpen] = useState(false);
  const [env, setEnv] = useState('SANDBOX');
  const [workspace, setWorkspace] = useState('Default workspace');
  const project = 'bizkids'; // the currently open project

  const [jobs, setJobs] = useState([]);
  const [toasts, setToasts] = useState([]);
  const cache = useRef({});
  // Refs so the export-completion timeout reads live UI state (not stale closures).
  const bellOpenRef = useRef(false);
  const watchRef = useRef(null);    // id of the export job whose "Preparing…" modal is still open
  const migWatchRef = useRef(null); // id of the migration whose "In progress…" modal is still open
  useEffect(()=>{ bellOpenRef.current = bellOpen; }, [bellOpen]);

  /* --- Migration state --- */
  const [migrations, setMigrations] = useState([]);
  const [migModal, setMigModal] = useState(null);
  const [migConfig, setMigConfig] = useState(null);
  const [migDetailId, setMigDetailId] = useState(null);
  // migModal: null | {step:'setup'} | {step:'summary',src,tgt} | {step:'processing',id,src,tgt}

  const downloadJob = jobs.find(j=>j.id===downloadJobId) || null;
  const unread = [
    ...jobs.filter(j=>jobReady(j) && !j.read && !j.dismissed),
    ...migrations.filter(m=>m.state==='COMPLETED' && !m.read && !m.dismissed),
  ].length;

  const dismissToast = (id)=> setToasts(p=>p.filter(x=>x.id!==id));
  const actOnToast = (t) => { if (t.type==='migration') actOnMigration(t.migId); else actOnJob(t.jobId); };
  const pushToast = (job) => {
    const excl = job.exclusions.length;
    const id = uid();
    const toast = {
      id, jobId: job.id, excluded: excl>0, ctx: job.ctx,
      variant: job.fromCache ? 'cache' : (excl ? 'warn' : 'ok'),
      title: job.fromCache ? 'Ready instantly' : (excl ? 'Export ready — with exclusions' : 'Export ready'),
      body: excl ? `${jobLabel(job)} · ${excl} excluded resource${excl>1?'s':''}` : jobLabel(job),
    };
    setToasts(p=>[...p, toast]);
    setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==id)), 9000);
  };

  const markRead = (id) => setJobs(p=>p.map(j=>j.id===id?{...j, read:true}:j));
  const markAllRead = () => { setJobs(p=>p.map(j=>({...j, read:true}))); setMigrations(p=>p.map(m=>({...m, read:true}))); };
  const dismissNote = (id) => {
    setJobs(p=>p.map(j=>j.id===id?{...j, dismissed:true, read:true}:j));
    setMigrations(p=>p.map(m=>m.id===id?{...m, dismissed:true, read:true}:m));
  };

  // Act on a ready export: clean → download the ZIP instantly; with exclusions → open the impact modal.
  const actOnJob = (jobId) => {
    const job = jobs.find(j=>j.id===jobId);
    if (!jobReady(job)) return;
    markRead(jobId);
    setBellOpen(false);
    if (job.state==='READY_WITH_EXCLUSIONS') setDownloadJobId(jobId);
    else triggerDownload(job);
  };

  const closeExport = () => { watchRef.current = null; setExportSource(null); };
  // The "Preparing…" modal for this job is still open → switch it straight to the download modal.
  const onExportReady = (job) => {
    watchRef.current = null;
    markRead(job.id);
    setExportSource(null);
    setDownloadJobId(job.id);
  };

  const startExport = (source, target, includeMedia) => {
    const ctx = { env, workspace, project }; // snapshot of where the export was launched
    const key = cacheKey(source, target, includeMedia);
    const cached = cache.current[key];
    if (cached){
      const job = { id:uid(), source, target, includeMedia, ctx, state:cached.state, exclusions:cached.exclusions, fromCache:true, read:false, ts:Date.now() };
      setJobs(p=>[job, ...p]);
      closeExport();
      if (!bellOpenRef.current) pushToast(job);          // suppress toast if the center is open
      if (job.state==='READY_WITH_EXCLUSIONS') setDownloadJobId(job.id);
      else triggerDownload(job);                          // instant + user-initiated
      return job;
    }
    const job = { id:uid(), source, target, includeMedia, ctx, state:'PROCESSING', exclusions:null, fromCache:false, read:false, ts:Date.now() };
    setJobs(p=>[job, ...p]);
    setTimeout(()=>{
      const excl = EXCLUSIONS[target] || [];
      const finished = { ...job, state: excl.length ? 'READY_WITH_EXCLUSIONS' : 'READY', exclusions: excl };
      cache.current[key] = { state:finished.state, exclusions:excl };
      setJobs(p=>p.map(j=>j.id===job.id? finished : j));
      // Suppress the right-side toast when the user is already looking:
      //   (a) the notification center is open, or (b) the Preparing modal for this job is open.
      const watched = watchRef.current === job.id;
      if (!watched && !bellOpenRef.current) pushToast(finished);
      // If watched, ExportModal's effect calls onExportReady → switches to the download modal.
    }, PROCESS_MS);
    return job;
  };

  /* --- Migration handlers --- */
  const startMigration = (src, tgt) => {
    const ctx = { env, workspace, project };
    const summary = genMigSummary();
    const id = uid();
    const mig = { id, type:'migration', opType:'Migration Bulk', opId:hexId(), srcBuild:src, tgtBuild:tgt,
                  state:'IN_PROGRESS', summary, ctx, read:false, dismissed:false, ts:Date.now() };
    setMigrations(p=>[mig, ...p]);
    migWatchRef.current = id; // caller opens the processing modal; we track it here
    setTimeout(()=>{
      const finished = { ...mig, state:'COMPLETED' };
      setMigrations(p=>p.map(m=>m.id===id ? finished : m));
      // Suppress toast when the processing modal is still open (it switches to detail directly)
      // or when the bell panel is already showing the result.
      const watched = migWatchRef.current === id;
      if (!watched && !bellOpenRef.current){
        const tid = uid();
        const total = mig.summary.migrateTo.length;
        setToasts(p=>[...p, {
          id:tid, migId:id, type:'migration', variant:'ok',
          title:'Bulk migration completed',
          body:`${src} → ${tgt} · ${total} process${total>1?'es':''} migrated`,
          ctx,
        }]);
        setTimeout(()=>setToasts(p=>p.filter(x=>x.id!==tid)), 9000);
      }
    }, MIGRATION_PROCESS_MS);
    return id;
  };

  const actOnMigration = (migId) => {
    setMigrations(p=>p.map(m=>m.id===migId?{...m, read:true}:m));
    setBellOpen(false);
    setMigDetailId(migId);
    setView('runtime');
    setPage('Corrective Actions');
  };

  const switchView = (v) => { setView(v); setPage(v==='runtime'?'Builds':'Processes'); setConsoleOpen(false); };
  const openExportBuild = (b) => setExportSource({ kind:'build', id:'build@'+b.tag, label:'Bizkids '+b.tag, tag:b.tag });
  const selectWorkspace = (e, ws) => { setEnv(e); setWorkspace(ws); setWsMenuOpen(false); };
  const hasRunning = jobs.some(j=>j.state==='PROCESSING') || migrations.some(m=>m.state==='IN_PROGRESS');

  return (
    <div className="app" onClick={()=>{ if(bellOpen)setBellOpen(false); if(wsMenuOpen)setWsMenuOpen(false); }}>

        onSelectWs={selectWorkspace}
      />
      {bellOpen &&
        <BellPanel
          jobs={jobs} migrations={migrations}
          onClose={()=>setBellOpen(false)} onMarkAll={markAllRead}
          onAct={actOnJob} onActMig={actOnMigration} onDismiss={dismissNote}
          stop={(e)=>e.stopPropagation()}

      <div className="body">
        <Sidebar nav={view==='runtime'?RUNTIME_NAV:NAV} page={page} setPage={setPage} />
        <div className="content">
          {migConfig
            ? <MigrationConfigPage
                src={migConfig.src} tgt={migConfig.tgt}
                onBack={()=>{ setMigConfig(null); setMigModal({step:'setup'}); }}
                onCancel={()=>setMigConfig(null)}
                onContinue={()=>{ const c=migConfig; setMigConfig(null); setMigModal({step:'summary', src:c.src, tgt:c.tgt}); }}
              />
            : migDetailId
            ? (() => {
                const m = migrations.find(x=>x.id===migDetailId);
                return m
                  ? <MigrationDetailPage mig={m} onBack={()=>setMigDetailId(null)} />
                  : null;
              })()
            : view==='config'
            ? (page==='Processes'
                ? <ProcessesPage onOpenConsole={()=>setConsoleOpen(true)} />
                : <GenericPage title={page} hasRunning={hasRunning} />)
            : (page==='Builds'
                ? <BuildsPage onExportBuild={openExportBuild} jobs={jobs} onAct={actOnJob} />
                : page==='Corrective Actions'
                ? <CorrectiveActionsPage
                    migrations={migrations}
                    onNewMigration={()=>setMigModal({step:'setup'})}
                    onViewDetail={(id)=>setMigDetailId(id)}
                  />
                : <GenericPage title={page} hasRunning={hasRunning} />)}
        </div>
      </div>

      {consoleOpen &&
        <BranchingConsole
          onClose={()=>setConsoleOpen(false)}
          onExport={()=>setExportSource(VERSION_SOURCE)}
        />}

      {exportSource &&
        <ExportModal
          source={exportSource}
          onClose={closeExport}
          onStart={startExport}
          onWatch={(id)=>{ watchRef.current = id; }}
          onReady={onExportReady}
          jobs={jobs}
          cache={cache}
        />}

      {downloadJob &&
        <DownloadModal
          job={downloadJob}
          onClose={()=>setDownloadJobId(null)}
          onChangeTarget={()=>{ const j=downloadJob; setDownloadJobId(null); setExportSource(j.source); }}
        />}

      {migModal?.step==='setup' &&
        <MigrationSetupModal
          onClose={()=>setMigModal(null)}
          onContinue={(src,tgt)=>{ setMigModal(null); setMigConfig({src, tgt}); }}
        />}
      {migModal?.step==='summary' &&
        <MigrationSummaryModal
          src={migModal.src} tgt={migModal.tgt}
          onBack={()=>{ const m=migModal; setMigModal(null); setMigConfig({src:m.src, tgt:m.tgt}); }}
          onStart={()=>{
            const id = startMigration(migModal.src, migModal.tgt);
            setMigModal({step:'processing', id, src:migModal.src, tgt:migModal.tgt});
          }}
          onClose={()=>setMigModal(null)}
        />}
      {migModal?.step==='processing' &&
        <MigrationProcessingModal
          migId={migModal.id} src={migModal.src} tgt={migModal.tgt}
          migrations={migrations}
          onClose={()=>{ migWatchRef.current=null; setMigModal(null); }}
          onComplete={(id)=>{ migWatchRef.current=null; setMigModal(null); setMigDetailId(id); setPage('Corrective Actions'); setView('runtime'); }}
        />}

      <Toasts toasts={toasts} onAct={actOnToast} onClose={dismissToast} />
      <div className="proto-stamp">Prototype · mocked backend</div>
    </div>
  );
}

/* ============================ Export modal ============================ */
function ExportModal({ source, onClose, onStart, onWatch, onReady, jobs, cache }){
  const [target, setTarget] = useState('5.9.X');
  const [media, setMedia] = useState(true);
  const [open, setOpen] = useState(false);
  const [phase, setPhase] = useState('form'); // form | processing
  const [pct, setPct] = useState(0);
  const [watchId, setWatchId] = useState(null);

  const isBuild = source.kind === 'build';
  const isLower = target !== '5.9.X';
  const willHitCache = !!cache.current[cacheKey(source, target, media)];

  useEffect(()=>{
    if (phase!=='processing') return;
    setPct(4);
    const t = setInterval(()=> setPct(p=> Math.min(p + (100/(PROCESS_MS/250)), 96)), 250);
    return ()=>clearInterval(t);
  }, [phase]);

  // While the Preparing modal is open, when this export becomes ready → switch to the download modal.
  useEffect(()=>{
    if (phase!=='processing' || !watchId) return;
    const j = jobs.find(x=>x.id===watchId);
    if (jobReady(j)) onReady(j);
  }, [jobs, watchId, phase]);

  const onExport = () => {
    if (willHitCache){ onStart(source, target, media); return; } // instant -> modal closes, download opens
    const job = onStart(source, target, media);
    if (job){ setWatchId(job.id); onWatch(job.id); }
    setPhase('processing');
  };

  return (
    <div className="modal-scrim" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        {phase==='form' ? (
          <>
            <div className="mhead">
              <button className="mclose" onClick={onClose}>{I.x}</button>
              <h2>{isBuild ? 'Export build' : 'Export Version'}</h2>
              <div style={{display:'flex',gap:7,alignItems:'center'}}>
                {isBuild
                  ? <span className="build-chip" style={{padding:'5px 12px',fontSize:13}}>{I.hammer} {source.label}</span>
                  : <>
                      <span className="dot" style={{background:'#1f6feb'}}></span>
                      <span className="vtag main">main</span><span className="vtag committed">committed</span>
                    </>}
              </div>
            </div>
            <div className="mbody">
              <div className="infobox">
                <span style={{color:'#e0a324'}}>💡</span>
                <span>Choose the target FlowX.AI version and whether to include media files in the export package. The exported ZIP can only be imported into environments running the selected version.</span>
              </div>

              <div className="field-label">Target platform version</div>
              <div className="select" onClick={()=>setOpen(o=>!o)}>
                <span>{VERSIONS.find(v=>v.id===target).label}</span>
                <span style={{display:'flex',alignItems:'center'}}>
                  {target==='5.9.X' && <span className="cur">Current Version</span>}
                  {I.chev}
                </span>
              </div>
              {open &&
                <div className="dd">
                  {VERSIONS.map(v=>(
                    <div key={v.id} className={'dd-item'+(v.id===target?' sel':'')}
                         onClick={()=>{setTarget(v.id);setOpen(false);}}>
                      <span>{v.label}</span>
                      {v.current && <span className="cur">Current Version</span>}
                    </div>
                  ))}
                </div>}
              <div className="help">Select the platform version running in the target environment.</div>

              {isLower &&
                <div className="infobox amber" style={{marginTop:14,marginBottom:0}}>
                  {I.warn}
                  <span>Some resources may not exist on <b>{target}</b> and will be excluded. You'll see the full list before downloading.</span>
                </div>}

              {willHitCache &&
                <div className="infobox" style={{marginTop:14,marginBottom:0,background:'#eef4ff',borderColor:'#d7e3ff',color:'#2a5fb0'}}>
                  ⚡ <span>An identical export already exists — it'll be available <b>instantly</b>, no waiting.</span>
                </div>}

              <div className="toggle-row">
                <button className={'switch'+(media?' on':'')} onClick={()=>setMedia(m=>!m)}><span className="knob"></span></button>
                <span style={{fontWeight:500}}>Include media file content <span style={{color:'#9aa4b2'}}>ⓘ</span></span>
              </div>

              <div className="mfoot">
                <button className="btn-ghost" onClick={onClose}>Cancel</button>
                <button className="btn-blue" onClick={onExport}>{willHitCache?'Get download':'Export'}</button>
              </div>
            </div>
          </>
        ) : (
          <div className="mbody" style={{paddingTop:30}}>
            <button className="mclose" onClick={onClose}>{I.x}</button>
            <div className="proc">
              <div className="spinner"></div>
              <h3>Preparing your export…</h3>
              <p>Building the ZIP for <b>{jobLabel({source, target})}</b>. This can take up to 15 minutes.<br/>You can close this and keep working — we'll notify you when it's ready.</p>
              <div className="progress"><div className="bar" style={{width:pct+'%'}}></div></div>
              <div className="sim-note">Simulated: ~6s instead of up to 15 min</div>
              <div className="mfoot" style={{justifyContent:'center',width:'100%'}}>
                <button className="btn-ghost" onClick={onClose}>Close — keep working</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================ Bell panel — unified notification center ============================ */
// One feed — exports and migrations unified. Other kinds (licence expiry, etc.) branch in NotifItem.
function notifStatus(item){
  if (item.type === 'migration'){
    switch(item.state){
      case 'IN_PROGRESS': return { cls:'proc', icon:I.control, title:'Bulk migration in progress…' };
      case 'COMPLETED':   return { cls:'ok',   icon:I.check,   title:'Bulk migration completed' };
      case 'FAILED':      return { cls:'err',  icon:I.x,       title:'Bulk migration failed' };
    }
  }
  switch(item.state){
    case 'PROCESSING':            return { cls:'proc', icon:I.clock, title:'Preparing export…' };
    case 'READY_WITH_EXCLUSIONS': return { cls:'warn', icon:I.warn,  title:`Export ready — ${(item.exclusions||[]).length} resource${(item.exclusions||[]).length>1?'s':''} excluded` };
    case 'FAILED':                return { cls:'err',  icon:I.x,     title:'Export failed' };
    default:                      return { cls:'ok',   icon:I.check, title:'Export ready to download' };
  }
}

function NotifItem({ item, onAct, onActMig, onDismiss }){
  const st = notifStatus(item);
  const isMig = item.type === 'migration';
  const isProcessing = item.state === 'PROCESSING' || item.state === 'IN_PROGRESS';
  const isReady = isMig ? item.state==='COMPLETED' : jobReady(item);
  const unread = isReady && !item.read;
  const subtitle = isMig
    ? `${item.srcBuild} → ${item.tgtBuild} · ${item.summary.migrateTo.length} process${item.summary.migrateTo.length>1?'es':''}`
    : jobLabel(item) + (item.fromCache?' · reused':'');
  const handleClick = () => { if (!isReady) return; isMig ? onActMig(item.id) : onAct(item.id); };
  return (
    <div className={'nitem'+(unread?' unread':'')}>
      {/* context header */}
      <div className="nrow1">
        {item.ctx && <>
          <span className={'env-badge sm '+envTone(item.ctx.env)}>{item.ctx.env}</span>
          <span className="nmeta">{item.ctx.workspace} · <span className="nproj">{I.folder}{item.ctx.project}</span></span>
        </>}
        <span className="ntime">{relTime(item.ts)}</span>
        {!isProcessing &&
          <button className="ndismiss" title="Dismiss" onClick={(e)=>{e.stopPropagation();onDismiss(item.id);}}>{I.x}</button>}
      </div>
      {/* notification body */}
      <div className="nrow2" onClick={handleClick} style={{cursor:isReady?'pointer':'default'}}>
        <span className={'nicon '+st.cls}>{isProcessing && isMig ? <span className="mini-spin" style={{width:16,height:16}}></span> : st.icon}</span>
        <div className="ntext">
          <div className="t">{st.title}</div>
          <div className="s">{subtitle}</div>
        </div>
        <div className="nright">
          {/* export actions */}
          {!isMig && item.state==='PROCESSING' &&
            <span className="nproc"><span className="mini-spin"></span> Preparing</span>}
          {!isMig && item.state==='READY' &&
            <button className="nbtn" onClick={(e)=>{e.stopPropagation();onAct(item.id);}}>{I.dl} Download</button>}
          {!isMig && item.state==='READY_WITH_EXCLUSIONS' &&
            <button className="nbtn warn" onClick={(e)=>{e.stopPropagation();onAct(item.id);}}>{I.dl} Review</button>}
          {!isMig && item.state==='FAILED' && <span className="chip fail">Failed</span>}
          {/* migration actions */}
          {isMig && item.state==='IN_PROGRESS' &&
            <span className="nproc"><span className="mini-spin"></span> In Progress</span>}
          {isMig && item.state==='COMPLETED' &&
            <button className="nbtn" onClick={(e)=>{e.stopPropagation();onActMig(item.id);}}>View</button>}
          {isMig && item.state==='FAILED' && <span className="chip fail">Failed</span>}
        </div>
      </div>
    </div>
  );
}

const NOTIF_FILTERS = [['ALL','All'],['SANDBOX','Sandbox'],['STAGING','Staging'],['PRODUCTION','Production']];
function BellPanel({ jobs, migrations, onClose, onMarkAll, onAct, onActMig, onDismiss, stop }){
  const [filter, setFilter] = useState('ALL');
  const feed = [...jobs, ...migrations]
    .filter(item=>!item.dismissed)
    .sort((a,b)=>b.ts-a.ts);
  const countFor = (e) => feed.filter(item=> e==='ALL' || (item.ctx && item.ctx.env===e)).length;
  const shown = feed.filter(item=> filter==='ALL' || (item.ctx && item.ctx.env===filter));
  const anyUnread = feed.some(item=>
    item.type==='migration' ? (item.state==='COMPLETED' && !item.read) : (jobReady(item) && !item.read)
  );
  return (
    <div className="bell-panel" onClick={stop}>
      <div className="bp-head">
        <h4>Notifications</h4>
        {anyUnread && <button onClick={onMarkAll}>Mark all read</button>}
      </div>
      <div className="bp-filters">
        {NOTIF_FILTERS.map(([k,label])=>(
          <button key={k} className={'fchip'+(filter===k?' on':'')} onClick={()=>setFilter(k)}>
            {label}<span className="fcount">{countFor(k)}</span>
          </button>
        ))}
      </div>
      <div className="nlist">
        {shown.length===0 &&
          <div className="empty">{feed.length===0 ? 'No notifications yet.' : 'Nothing in this environment.'}</div>}
        {shown.map(item=> <NotifItem key={item.id} item={item} onAct={onAct} onActMig={onActMig} onDismiss={onDismiss} />)}
      </div>
    </div>
  );
}

function OpStatusPill({ status, state }){
  if (state==='IN_PROGRESS' || status==='In Progress') return <span className="status-pill in-progress"><span className="mini-spin" style={{width:12,height:12}}></span> In Progress</span>;
  if (status==='Completed')  return <span className="status-pill completed">Completed</span>;

function MigrationProcessingModal({ migId, src, tgt, migrations, onClose, onComplete }){

  useEffect(()=>{
    setPct(4);
    const t = setInterval(()=>setPct(p=>Math.min(p + (100/(MIGRATION_PROCESS_MS/250)), 96)), 250);

  // Watch for migration completion → switch to detail

    const m = migrations.find(x=>x.id===migId);

  return (
    <div className="modal-scrim" onClick={onClose}>

        Select current node and target node and move all running tokens from one node to another after migration on target build. <span className="info-icon" data-tooltip="Tokens waiting on the source node are moved to the chosen target node after migration">i</span>
      </div>
      {p.moveTokens.map((t,i)=>(
        <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 26px 1fr 40px',alignItems:'end',gap:10,marginBottom:6}}>
          <div>
            <div className="mig-col-head" style={{textTransform:'none',fontSize:11.5,color:'#5b6573'}}>Current Node</div>
            <NodeSel icon="token" label={t.from} editable/>
          </div>
          <span style={{color:'#c2cad4',textAlign:'center',paddingBottom:10}}>{I.arrowR}</span>
          <div>
            <div className="mig-col-head" style={{textTransform:'none',fontSize:11.5,color:'#5b6573'}}>Target Node</div>
            <NodeSel icon="proc" label={t.to} editable/>
          </div>
          <button className="mig-token-trash" title="Remove">{I.trash}</button>
        </div>
      ))}
      <button className="mig-choose">{I.plus} Choose Node</button>
    </>
  );

  return (
    <div style={{padding:'24px 28px',flex:1,overflowY:'auto',minHeight:0}}>
      {/* Breadcrumb */}
      <div className="mig-detail-breadcrumb">
        <button className="back-btn" onClick={onBack}>{I.arrowL} Process Instances</button>
        <span className="sep">/</span>
        <span className="crumb-cur">Migration Configuration</span>
      </div>

      {/* Header card — mirrors the Migration Status header */}
      <div className="mig-summary-card">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'24px 28px',gap:24,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:280}}>
            <h2 style={{fontSize:20,fontWeight:700,color:'#1f2733',margin:'0 0 8px 0'}}>Migration Configuration</h2>
            <p style={{margin:0,color:'var(--muted)',fontSize:13.5,lineHeight:1.55,maxWidth:560}}>
              Review how each process and its running instances will move from the source build to the target build. Nothing runs until you start the operation.
            </p>
          </div>
          <div className="mig-build-row" style={{flexShrink:0}}>
            <div className="mig-build-box">
              <div className="mig-build-label">Source Build</div>
              <div className="mig-build-chip">{I.gitBranch} {src}</div>
            </div>
            <div style={{color:'#8c98a8',margin:'0 4px',paddingTop:20}}>{I.arrowR}</div>
            <div className="mig-build-box">
              <div className="mig-build-label">Target Build</div>
              <div className="mig-build-chip">{I.gitBranch} {tgt}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Processes card */}
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div className="inst-table-head">
          <div>
            <div style={{marginBottom:4}}>
              <span style={{fontWeight:700,fontSize:15,color:'#1f2733'}}>Processes with running instances</span>
            </div>
            <div style={{fontSize:12.5,color:'var(--muted)',lineHeight:1.5,maxWidth:620}}>
              Below are the processes with running instances on the source build. Check the node mapping and the destination of active tokens. <span className="doclink">Review the documentation</span> for limitations and how to monitor an operation.
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#8c98a8',pointerEvents:'none'}}>{I.search}</span>
              <input
                style={{paddingLeft:32,paddingRight:10,height:34,border:'1px solid var(--border)',borderRadius:8,fontSize:13,width:220,outline:'none',background:'#fafbfc'}}
                placeholder="Search processes…"
                value={search}
                onChange={e=>setSearch(e.target.value)}
              />
            </div>
          </div>
        </div>

        {/* Readiness — interactive filter, mirrors Outcome on Migration Status */}
        <div style={{padding:'16px 22px',borderBottom:'1px solid var(--border)',background:'#fafbfc'}}>
          <div className="outcome-label" style={{marginBottom:8}}>
            <span>Readiness</span>
            <span className="outcome-total"><b>{total}</b> processes&nbsp;·&nbsp;~{instCount} root instances <span className="info-icon" data-tooltip="Root instances are top-level process instances; child / subprocess instances are migrated together with their parent.">i</span></span>
          </div>
          <div className="outcome-bar" style={{marginBottom:12}}>
            <div style={{width:(readyN/total*100)+'%',background:'#1f7a4d'}}/>
            <div style={{width:(mappingN/total*100)+'%',background:'#e2a81c'}}/>
            <div style={{width:(notfoundN/total*100)+'%',background:'#d6453a'}}/>
          </div>
          <div className="outcome-stats-row">
            {READY_STATS.map(s=>{
              const active = statusFilter===s.key;
              return (
                <div className="outcome-stat" key={s.key}
                  onClick={()=>setStatusFilter(f=>f===s.key?null:s.key)}
                  style={active ? {background:s.bg, outline:`1.5px solid ${s.dot}40`} : undefined}>
                  <div className="outcome-dot" style={{background:s.dot}}/>
                  <span className="ol" style={{fontWeight:active?700:undefined}}>{s.label}</span>
                  <span className="ov">{s.n}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Process list */}
        <div style={{padding:'16px 22px 20px'}}>
        {procs.length===0 && (
          <div style={{padding:'22px 0',textAlign:'center',color:'var(--muted)',fontSize:13}}>No processes match the current filter.</div>
        )}
        {procs.map(p=>{
          const st = MIG_STATUS[p.status];
          const isOpen = !!open[p.id];
          const undecided = p.status==='notfound' && !notFound[p.id];
          return (
            <div className="mig-proc-card" key={p.id}>
              <div className="mig-proc-head" onClick={()=>tog(p.id)}>
                <span style={{fontWeight:600,fontSize:14,color:'#1f2733'}}>{p.name}</span>
                <span className="mig-pbadge">{p.badgeIcon==='box'?I.box:I.folder} {p.badge}</span>
                <span style={{flex:1}}/>
                {undecided && <span className="mig-needs-decision">Needs a decision</span>}
                <span className="mig-status-pill" style={{background:st.bg,color:st.color}}>{I[st.icon]} {st.label}</span>
                <span className={'pchev'+(isOpen?' open':'')}>{I.chev}</span>
              </div>
              {isOpen && (
                <div className="mig-proc-body">
                  {p.status==='ready' && (
                    <>
                      <div className="mig-sub-label">Node mapping between builds</div>
                      <div className="mig-sub-desc" style={{display:'flex',alignItems:'center',gap:6,color:'#1f7a4d',marginBottom:4}}>
                        {I.check} All nodes mapped <span className="info-icon" data-tooltip="Every node in the source process has a matching node on the target build">i</span>
                      </div>
                      <MoveTokens p={p}/>
                    </>
                  )}
                  {p.status==='mapping' && (
                    <>
                      <div className="mig-sub-label">Node mapping between builds</div>
                      <div className="mig-sub-desc">
                        Some nodes in the process from source build do not exist on target build. Missing nodes will be automatically mapped on the last visited node on the process on target build. <span className="doclink">Review the nodes mapping documentation</span> <span className="info-icon" data-tooltip="Unmapped source nodes fall back to the last visited node on the target">i</span>
                      </div>
                      <div className="mig-nodemap-row" style={{marginBottom:7}}>
                        <div className="mig-col-head">Process Nodes <span className="bchip">{I.gitBranch} {src}</span></div>
                        <span/>
                        <div className="mig-col-head">Process Nodes <span className="bchip">{I.gitBranch} {tgt}</span></div>
                      </div>
                      {p.nodeMap.map((n,i)=>(
                        <div className="mig-nodemap-row" key={i}>
                          <NodeSel icon={n.fromIcon} label={n.from} editable/>
                          <span style={{color:'#c2cad4',textAlign:'center'}}>{I.arrowR}</span>
                          <NodeSel label="last visited node" editable/>
                        </div>
                      ))}
                      <MoveTokens p={p}/>
                    </>
                  )}
                  {p.status==='notfound' && (
                    <>
                      <div className="mig-sub-label">Process not found on target build</div>
                      <div className="mig-sub-desc">
                        This process doesn't exist on target build {tgt}, so its running instances can't be migrated. Choose what happens to them.
                      </div>
                      <div className="mig-radio-grp">
                        <div className={'mig-radio-opt'+(choiceOf(p.id)==='terminate'?' sel':'')} onClick={()=>setNotFound(s=>({...s,[p.id]:'terminate'}))}>
                          <span className="mig-radio-dot"/>
                          <div><div className="rt">Terminate all running instances</div><div className="rd">Move every instance on this process to TERMINATED state.</div></div>
                        </div>
                        <div className={'mig-radio-opt'+(choiceOf(p.id)==='leave'?' sel':'')} onClick={()=>setNotFound(s=>({...s,[p.id]:'leave'}))}>
                          <span className="mig-radio-dot"/>
                          <div><div className="rt">Leave on current build</div><div className="rd">Instances stay on Build {src} untouched and keep running.</div></div>
                        </div>
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
          );
        })}
        </div>
      </div>

      {/* Footer */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:18,gap:16,flexWrap:'wrap'}}>
        <div style={{fontSize:13,display:'flex',alignItems:'center',gap:8,color: pendingDecisions>0 ? '#c2392e' : 'var(--muted)'}}>
          {pendingDecisions>0
            ? <><span style={{display:'inline-flex',color:'#c2392e'}}>{I.warn}</span><span><b>{pendingDecisions}</b> process{pendingDecisions!==1?'es':''} need{pendingDecisions===1?'s':''} a decision before you can continue.</span></>
            : <><span style={{display:'inline-flex',color:'#1f7a4d'}}>{I.check}</span><span>All processes reviewed — ready to continue.</span></>}
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn-ghost" onClick={onCancel}>Cancel</button>
          <button className="btn-blue" onClick={canContinue?onContinue:undefined} style={!canContinue?{opacity:.45,cursor:'not-allowed'}:{}}>Check Operation Summary {I.arrowR}</button>
        </div>
      </div>
    </div>
  );
}

function MigrationDetailPage({ mig, onBack }){
  const { srcBuild, tgtBuild, opId, ts } = mig;
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState({ col:'status', dir:'asc' });   // status asc = errors first
  const [colFilters, setColFilters] = useState({ procName:[], status:[], details:[] });
  const [openFilter, setOpenFilter] = useState(null);
  const [visible, setVisible] = useState(10);

  const success = MOCK_INSTANCES.filter(r=>r.status==='Success').length;
  const failed  = MOCK_INSTANCES.filter(r=>r.status==='Failed').length;
  const total   = MOCK_INSTANCES.length;
  const procCount = new Set(MOCK_INSTANCES.map(r=>r.procName)).size;
  const pctS = Math.round(success/total*100);
  const pctF = 100 - pctS;

  const distinct = col => [...new Set(MOCK_INSTANCES.map(r=>r[col]))];
  const toggleColFilter = (col, v) => setColFilters(f=>{
    const cur = f[col]; const next = cur.includes(v) ? cur.filter(x=>x!==v) : [...cur, v];
    return {...f, [col]:next};
  });
  const toggleSort = col => setSort(s => s.col===col ? {col, dir: s.dir==='asc'?'desc':'asc'} : {col, dir:'asc'});

  const filtered = MOCK_INSTANCES.filter(r=>
    (!search || r.id.includes(search) || r.procName.includes(search.toLowerCase())) &&
    (colFilters.procName.length===0 || colFilters.procName.includes(r.procName)) &&
    (colFilters.status.length===0   || colFilters.status.includes(r.status)) &&
    (colFilters.details.length===0  || colFilters.details.includes(r.details))
  );
  const statusRank = s => s==='Failed' ? 0 : 1;   // errors first
  const sorted = [...filtered].sort((a,b)=>{
    let r = 0;
    if (sort.col==='status')        r = statusRank(a.status) - statusRank(b.status);
    else if (sort.col==='procName') r = a.procName.localeCompare(b.procName);
    else if (sort.col==='details')  r = a.details.localeCompare(b.details);
    return sort.dir==='desc' ? -r : r;
  });
  const shown = sorted.slice(0, visible);

  // reset the infinite-scroll window whenever the result set changes
  useEffect(()=>{ setVisible(10); }, [search, sort, colFilters]);
  // load more rows as the table scrolls toward the bottom
  const onTableScroll = e => {
    const el = e.currentTarget;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 80) setVisible(v=>Math.min(v+10, sorted.length));
  };

  const thStyle = {padding:'10px 14px',textAlign:'left',fontWeight:600,fontSize:11.5,color:'#697586',letterSpacing:'.04em',textTransform:'uppercase',whiteSpace:'nowrap',background:'#f7f8fa',borderBottom:'1px solid var(--border)'};
  const ColHeader = ({col, label}) => {
    const active = sort.col===col;
    const fActive = colFilters[col].length>0;
    return (
      <th style={{...thStyle, textTransform:'none', letterSpacing:0}}>
        <div className="col-head-cell">
          <span className="col-sort" onClick={()=>toggleSort(col)}>
            {label}
            <span className={'sarrow'+(active&&sort.dir==='asc'?' sarrow-asc':'')} style={{color: active?'var(--blue)':'#c2cad4'}}>{I.caret}</span>
          </span>
          <span className={'col-filter-btn'+(fActive?' active':'')} onClick={()=>setOpenFilter(o=>o===col?null:col)}>{I.filter}</span>
          {openFilter===col && (
            <div className="col-filter-dd">
              {distinct(col).map(v=>(
                <label className="col-filter-item" key={v}>
                  <input type="checkbox" checked={colFilters[col].includes(v)} onChange={()=>toggleColFilter(col,v)} />
                  <span>{v||'—'}</span>
                </label>
              ))}
              {fActive && <button className="col-filter-clear" onClick={()=>setColFilters(f=>({...f,[col]:[]}))}>Clear filter</button>}
            </div>
          )}
        </div>
      </th>
    );
  };

  const startTs = ts ? new Date(ts) : new Date('2025-10-07T23:40:00');
  const endTs   = new Date(startTs.getTime() + 8431);
  const fmtDate = (d) => d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ', ' +
    d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true}).replace(/^0/,'').replace(' am',' AM').replace(' pm',' PM');
  const durMs = endTs - startTs;
  const durStr = durMs < 60000 ? `${Math.round(durMs/1000)}s` : `${Math.round(durMs/60000)}m ${Math.round((durMs%60000)/1000)}s`;

  return (
    <div style={{padding:'24px 28px',flex:1,overflowY:'auto',minHeight:0}}>
      {/* Breadcrumb */}
      <div className="mig-detail-breadcrumb">
        <button className="back-btn" onClick={onBack}>{I.arrowL} Operations</button>
        <span className="sep">/</span>
        <span className="crumb-cur">Migration <span className="crumb-id">{opId||'e4d7d1a2'}…</span></span>
      </div>

      {/* Summary card */}
      <div className="mig-summary-card">
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',padding:'24px 28px',gap:24}}>
          {/* Left: title + meta */}
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:12,margin:'0 0 10px 0',flexWrap:'wrap'}}>
              <h2 style={{fontSize:20,fontWeight:700,color:'#1f2733',margin:0}}>Migration Status</h2>
              <OpStatusPill status={mig.state==='COMPLETED'?'Completed':mig.state==='FAILED'?'Failed':'In Progress'} state={mig.state} />
            </div>
            <div className="mig-meta-row">
              <div className="mig-meta-item">
                <span style={{fontSize:11,fontWeight:700,color:'#8c98a8',letterSpacing:'.04em'}}>Operation ID</span>
                <b>{opId||'e4d7d1a2'}</b>
                <span style={{color:'#8c98a8',cursor:'pointer',display:'inline-flex'}}>{I.copy}</span>
              </div>
              <div className="mig-meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <span>{fmtDate(startTs)}</span>
              </div>
              <div className="mig-meta-item">
                {I.clock}
                <span>Ran in {durStr}</span>
              </div>
            </div>
          </div>
          {/* Right: build chips */}
          <div className="mig-build-row" style={{flexShrink:0}}>
            <div className="mig-build-box">
              <div className="mig-build-label">Source Build</div>
              <div className="mig-build-chip">{I.gitBranch} {srcBuild}</div>
            </div>
            <div style={{color:'#8c98a8',margin:'0 4px',paddingTop:20}}>{I.arrowR}</div>
            <div className="mig-build-box">
              <div className="mig-build-label">Target Build</div>
              <div className="mig-build-chip">{I.gitBranch} {tgtBuild}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Instances table */}
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div className="inst-table-head">
          <div>
            <div style={{marginBottom:4}}>
              <span style={{fontWeight:700,fontSize:15,color:'#1f2733'}}>Process Instances</span>
            </div>
            <div style={{fontSize:12.5,color:'var(--muted)',whiteSpace:'nowrap'}}>
              Per-instance result of this migration run. Failed instances can be retried individually.
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#8c98a8',pointerEvents:'none'}}>{I.search}</span>
              <input
                style={{paddingLeft:32,paddingRight:10,height:34,border:'1px solid var(--border)',borderRadius:8,fontSize:13,width:220,outline:'none',background:'#fafbfc'}}
                placeholder="Search instances…"
                value={search}
                onChange={e=>{setSearch(e.target.value);setPage(1);}}
              />
            </div>
          </div>
        </div>

        {/* Outcome — between header and table */}
        <div style={{padding:'16px 22px',borderBottom:'1px solid var(--border)',background:'#fafbfc'}}>
          <div className="outcome-label" style={{marginBottom:8}}>
            <span>Outcome</span>
            <span className="outcome-total"><b>{total}</b> instances <span style={{color:'var(--muted)',fontWeight:400}}>({procCount} processes&nbsp;·&nbsp;{ROOT_INSTANCES} root instances)</span></span>
          </div>
          <div className="outcome-bar" style={{marginBottom:12}}>
            <div style={{width:pctS+'%',background:'#1f7a4d'}}/>
            <div style={{width:pctF+'%',background:'#d6453a'}}/>
          </div>
          <div className="outcome-stats-row">
            {[
              {label:'Success', n:success, pct:pctS, dot:'#1f7a4d', bg:'#e7f6ee'},
              {label:'Failed',  n:failed,  pct:pctF, dot:'#d6453a', bg:'#fdeceb'},
            ].map(s=>{
              const active = colFilters.status.includes(s.label);
              return (
                <div
                  className="outcome-stat"
                  key={s.label}
                  onClick={()=>toggleColFilter('status', s.label)}
                  style={active ? {background:s.bg, outline:`1.5px solid ${s.dot}40`} : undefined}
                >
                  <div className="outcome-dot" style={{background:s.dot}}/>
                  <span className="ol" style={{fontWeight:active?700:undefined}}>{s.label}</span>
                  <span className="ov">{s.n}</span>
                  <span className="op">({s.pct}%)</span>
                </div>
              );
            })}
          </div>
        </div>

        <div onScroll={onTableScroll} style={{maxHeight:380,overflowY:'auto',overflowX:'auto'}}>
        <table style={{width:'100%',minWidth:680,borderCollapse:'collapse',fontSize:13}}>
          <thead style={{position:'sticky',top:0,zIndex:1}}>
            <tr style={{background:'#f7f8fa',borderBottom:'1px solid var(--border)'}}>
              <th style={thStyle}>Process Instance UUID</th>
              <ColHeader col="procName" label="Process Name"/>
              <ColHeader col="status" label="Status"/>
              <ColHeader col="details" label="Details"/>
              <th style={thStyle}>Migrated At</th>
            </tr>
          </thead>
          <tbody>
            {shown.map((r)=>(
              <tr key={r.id} style={{borderBottom:'1px solid #f0f2f5',transition:'background .12s'}}
                  onMouseEnter={e=>e.currentTarget.style.background='#fafbff'}
                  onMouseLeave={e=>e.currentTarget.style.background=''}>
                <td style={{padding:'11px 14px',fontFamily:'SF Mono,ui-monospace,monospace',fontSize:12,color:'#697586'}}>{r.id.slice(0,20)}…</td>
                <td style={{padding:'11px 14px',fontWeight:500,color:'#222b38'}}>{r.procName}</td>
                <td style={{padding:'11px 14px'}}><InstStatusPill status={r.status}/></td>
                <td style={{padding:'11px 14px',color:r.details==='-'?'#8c98a8':r.status==='Failed'?'#c0392b':'#9a6a16',fontSize:12.5}}>{r.details}</td>
                <td style={{padding:'11px 14px',color:'#697586',whiteSpace:'nowrap'}}>{r.migratedAt}</td>
              </tr>
            ))}
            {shown.length===0 && (
              <tr><td colSpan={5} style={{padding:'26px 14px',textAlign:'center',color:'var(--muted)',fontSize:13}}>No instances match the current filters.</td></tr>
            )}
          </tbody>
        </table>
        </div>
        <div className="inst-footer">
          <span>Showing <b>{shown.length}</b> of {sorted.length} instances{sorted.length!==total ? ` (filtered from ${total})` : ''}</span>
          <span style={{color:'var(--muted)'}}>{total} instances total</span>
        </div>
      </div>

      {openFilter && <div onClick={()=>setOpenFilter(null)} style={{position:'fixed',inset:0,zIndex:55}}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
